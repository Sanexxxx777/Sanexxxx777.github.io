/* index.css: витрина приёмов. Своё поверх base.css, конвенция ~/.claude/refs/css-conventions.md.
   Витрина нейтральная, постоянно тёмная (без color-scheme): приёмы в iframe остаются главными. */

:root{
  /* примитивы витрины: своя палитра, не пересекается с base.css */
  --show-neutral-950:#0b0c0f;
  --show-neutral-900:#131419;
  --show-neutral-800:#1a1c23;
  --show-neutral-700:#24262f;
  --show-neutral-600:#383b46;
  --show-neutral-400:#7d8290;
  --show-neutral-200:#c7cad3;
  --show-neutral-050:#f2f2f4;
  --show-accent-500:#7c8cff;
  --show-accent-300:#aab4ff;
}
:root{
  /* семантика: переопределяет base.css своими значениями, витрина всегда тёмная */
  --background-color-primary:var(--show-neutral-950);
  --background-color-secondary:var(--show-neutral-900);
  --background-color-tertiary:var(--show-neutral-800);
  --text-color-primary:var(--show-neutral-050);
  --text-color-secondary:var(--show-neutral-400);
  --text-color-brand:var(--show-accent-300);
  --border-color-primary:var(--show-neutral-700);
  --border-color-brand:var(--show-accent-500);
  --surface-color-card:var(--show-neutral-900);
  --surface-color-card-hover:var(--show-neutral-800);
  --surface-color-chip:var(--show-neutral-800);
  --surface-color-chip-active:var(--show-accent-500);
  --text-color-chip-active:var(--show-neutral-950);
  --overlay-color-scrim:rgb(6 7 10 / 78%);
  --sheen-color:255 214 170;          /* тёплый блик по кромке карточки */
  --sticky-top:0px;                   /* публичная сборка: высота brand-bar */
}

/* ── Шапка: заголовок + числа одной строкой, вводная одной строкой; первая карточка на первом экране ── */
.showcase-header{display:flex;flex-direction:column;gap:0.5rem;padding:1.25rem 0 1rem}
.showcase-header_top{
  display:flex;align-items:baseline;justify-content:space-between;gap:0.25rem 1rem;flex-wrap:wrap;
}
.showcase-header_title{margin:0}
.showcase-lead{margin:0;max-width:none;font-size:0.875rem;line-height:1.5}

/* числовая полоса «N приёмов · T типов · S стеков» */
.numeral-strip{
  margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0.25rem 0.75rem;
  color:var(--text-color-secondary);font-size:0.875rem;
}
.numeral-strip_num{
  color:var(--text-color-primary);font-size:1.5rem;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;
}
.numeral-strip_sep{color:var(--border-color-brand)}

/* ── Ряд фильтров: один ряд, липкий только на ≥992 px (высота ≤64 px) ──── */
.filter-bar{border-bottom:1px solid var(--border-color-primary)}
.filter-bar_inner{display:flex;flex-direction:column;gap:0.5rem;padding:0.75rem 0}
@media (min-width:992px){
  .filter-bar{
    position:sticky;top:var(--sticky-top);z-index:30;
    background:var(--background-color-primary);
  }
  .filter-bar_inner{flex-direction:row;align-items:center;gap:1rem;padding:0.5rem 0}
}
/* типы: одна строка без переноса, лишнее уезжает в горизонтальную прокрутку с затуханием справа */
.filter-bar_types{
  display:flex;flex-wrap:nowrap;gap:0.375rem;
  flex:1 1 auto;min-width:0;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
}
.filter-bar_types::-webkit-scrollbar{display:none}
.filter-bar_types.is-clipped{
  -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 2.5rem), transparent);
  mask-image:linear-gradient(to right, #000 calc(100% - 2.5rem), transparent);
}
.filter-bar_types .chip{flex:none;white-space:nowrap}
.filter-bar_tools{position:relative;display:flex;align-items:center;gap:0.5rem;flex:none}
.showcase-header_search{
  flex:1 1 auto;width:11rem;min-width:0;
  padding:0.4375rem 0.75rem;
  border:1px solid var(--border-color-primary);
  border-radius:0.5rem;
  background:var(--background-color-secondary);
  color:var(--text-color-primary);
  font-size:0.875rem;line-height:1.2;
}
.showcase-header_search::placeholder{color:var(--text-color-secondary)}
.filter-more_toggle,
.reset-button{
  flex:none;
  padding:0.4375rem 0.75rem;
  border:1px solid var(--border-color-primary);
  border-radius:0.5rem;
  background:transparent;
  color:var(--text-color-secondary);
  font-size:0.875rem;line-height:1.2;white-space:nowrap;
  cursor:pointer;
}
.filter-more_toggle:hover,.reset-button:hover,
.filter-more_toggle[aria-expanded="true"]{color:var(--text-color-primary);border-color:var(--border-color-brand)}
.filter-more_count{margin-left:0.375rem;color:var(--text-color-brand)}
.reset-button[hidden],.filter-more_count[hidden]{display:none}
/* «Ещё фильтры»: раскрывающаяся панель поверх сетки, высоту липкого ряда не меняет */
.filter-more_panel{
  position:absolute;right:0;top:calc(100% + 0.5rem);z-index:40;
  width:min(26rem, calc(100vw - 2rem));
  display:flex;flex-direction:column;gap:1rem;
  padding:1rem;
  border:1px solid var(--border-color-primary);
  border-radius:0.75rem;
  background:var(--background-color-secondary);
  box-shadow:0 1rem 2.5rem rgb(0 0 0 / 50%);
}
.filter-more_panel[hidden]{display:none}
@media (max-width:991px){
  .filter-bar_tools{width:100%}
}

.filter-group{display:flex;flex-direction:column;gap:0.5rem}
.filter-group_label{margin:0}
.filter-group_chips{display:flex;flex-wrap:wrap;gap:0.5rem}

.chip{
  position:relative;
  padding:0.25rem 0.75rem;
  border:1px solid var(--border-color-primary);
  border-radius:999px;
  background:var(--surface-color-chip);
  color:var(--text-color-secondary);
  font-size:0.875rem;
  cursor:pointer;
  line-height:1.6;
}
.card-action.is-primary{
  background:var(--surface-color-chip-active);
  border-color:var(--surface-color-chip-active);
  color:var(--text-color-chip-active);
}
/* активный чип = оттиск (по мотивам techniques/stamp): прижим .96→1 за 120 мс + 2px акцентная черта */
.chip.is-active{
  color:var(--text-color-primary);
  border-color:var(--border-color-brand);
  box-shadow:inset 0 -2px 0 var(--border-color-brand);
  animation:chip-press 120ms cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes chip-press{from{transform:scale(.96)}to{transform:scale(1)}}

/* ── Сетка карточек ────────────────────────────────────────────────────── */
.catalog-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:1.5rem;
}
@media (min-width:640px){ .catalog-grid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
@media (min-width:1280px){ .catalog-grid{grid-template-columns:repeat(3, minmax(0, 1fr))} }
.showcase-catalog{padding:1.25rem 0 5rem}
.empty-state{margin-top:3rem;text-align:center}

.card{
  position:relative;
  display:flex;flex-direction:column;
  border:1px solid var(--border-color-primary);
  border-radius:0.75rem;
  background:var(--surface-color-card);
  overflow:hidden;
}
/* блик по кромке: кольцо 1px из радиального градиента под курсором (по мотивам techniques/sheen-card) */
.card::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  padding:1px;border-radius:inherit;
  background:radial-gradient(14rem circle at var(--mx,50%) var(--my,0%), rgb(var(--sheen-color) / 90%), transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity:0;transition:opacity .3s ease;
}
.card:hover::after{opacity:1}

/* превью: постер + (по требованию) живой iframe поверх, кроссфейд 250 мс */
.card_preview{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  border-bottom:1px solid var(--border-color-primary);
  cursor:pointer;
}
.card_poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card_frame{
  position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  opacity:0;transition:opacity 250ms ease;
}
.card_frame.is-shown{opacity:1}
.card_play{
  position:absolute;left:0.625rem;top:0.625rem;z-index:2;
  padding:0.25rem 0.625rem;
  border:1px solid rgb(255 255 255 / 25%);
  border-radius:999px;
  background:rgb(0 0 0 / 55%);
  color:#fff;font-size:0.75rem;line-height:1.5;
  cursor:pointer;
  transition:opacity 250ms ease;
}
.card_play:hover,.card_play:focus-visible{border-color:var(--border-color-brand)}
.card.is-live .card_play{opacity:0;pointer-events:none}
/* мышь: кнопка проявляется при наведении/фокусе, чтобы не спорить с кадром; тач видит её всегда */
@media (hover:hover) and (pointer:fine){
  .card:not(:hover) .card_play:not(:focus-visible){opacity:0}
}
.card_live{
  position:absolute;top:0.625rem;right:0.625rem;z-index:2;
  display:flex;align-items:center;gap:0.375rem;
  padding:0.125rem 0.5rem;
  border-radius:999px;
  background:rgb(0 0 0 / 55%);
  color:#fff;font-size:0.625rem;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace;
  opacity:0;transition:opacity 250ms ease;pointer-events:none;
}
.card_live::before{
  content:"";width:0.4rem;height:0.4rem;border-radius:50%;
  background:var(--border-color-brand);box-shadow:0 0 0.5rem var(--border-color-brand);
}
.card.is-live .card_live{opacity:1}
.card_new{
  display:inline-block;vertical-align:0.15em;margin-left:0.25rem;
  padding:0.0625rem 0.5rem;
  border:1px solid var(--border-color-brand);
  border-radius:999px;
  color:var(--text-color-brand);
  font-size:0.6875rem;letter-spacing:.06em;text-transform:uppercase;
}
.card_body{display:flex;flex-direction:column;gap:0.5rem;padding:1rem}
.card_title{margin:0}
.card_summary{margin:0}
.card_chips{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.25rem}
.card_chip{
  padding:0.125rem 0.5rem;
  border-radius:999px;
  background:var(--background-color-tertiary);
  color:var(--text-color-secondary);
  font-size:0.75rem;
}
.card_source{margin:0.25rem 0 0}
.card_actions{display:flex;gap:0.75rem;margin-top:0.5rem}
/* заказ под приём: полоса во всю ширину по низу карточки, прижата margin-top:auto, чтобы в ряду стояли на одной линии */
.card_want{
  display:flex;align-items:center;justify-content:space-between;gap:0.5rem;
  margin-top:auto;
  padding:0.625rem 1rem;
  border-top:1px solid var(--border-color-primary);
  color:var(--text-color-brand);
  font-size:0.8125rem;text-decoration:none;
}
.card_want:hover,.card_want:focus-visible{background:var(--text-color-brand);color:var(--background-color-primary)}

.card-action{
  padding:0.5rem 1rem;
  border-radius:0.5rem;
  border:1px solid var(--border-color-primary);
  background:transparent;
  color:var(--text-color-primary);
  font-size:0.875rem;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

/* ── Диалог промпта ────────────────────────────────────────────────────── */
.prompt-dialog{
  padding:0;
  border:1px solid var(--border-color-primary);
  border-radius:0.75rem;
  background:var(--background-color-secondary);
  color:var(--text-color-primary);
  width:min(40rem, 92vw);
  max-height:85vh;
}
.prompt-dialog::backdrop{background:var(--overlay-color-scrim)}
.prompt-dialog_panel{display:flex;flex-direction:column;max-height:85vh}
.prompt-dialog_header{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1rem 1.5rem;
  border-bottom:1px solid var(--border-color-primary);
}
.prompt-dialog_title{margin:0}
.prompt-dialog_close{
  border:0;background:transparent;color:var(--text-color-secondary);
  font-size:1.5rem;line-height:1;cursor:pointer;padding:0 0.25rem;
}
.prompt-dialog_close:hover{color:var(--text-color-primary)}
.prompt-dialog_body{padding:1.5rem;overflow-y:auto}
.prompt-dialog_body blockquote{
  margin:0;padding:1rem;
  border-left:2px solid var(--border-color-brand);
  background:var(--background-color-tertiary);
  color:var(--text-color-primary);
}
.prompt-dialog_body code{
  background:var(--background-color-tertiary);
  padding:0.125rem 0.375rem;
  border-radius:0.25rem;
  font-family:ui-monospace,Menlo,monospace;
  font-size:0.875rem;
}
.prompt-dialog_footer{
  padding:1rem 1.5rem;
  border-top:1px solid var(--border-color-primary);
  display:flex;justify-content:flex-end;
}
.prompt-dialog_copy{
  padding:0.5rem 1rem;
  border-radius:0.5rem;
  border:1px solid var(--surface-color-chip-active);
  background:var(--surface-color-chip-active);
  color:var(--text-color-chip-active);
  cursor:pointer;
}

@media (prefers-reduced-motion:reduce){
  .chip.is-active{animation:none}
  .card::after,.card_frame,.card_play,.card_live{transition:none}
}

@media (max-width:479px){
  .showcase-header_top{flex-direction:column;align-items:flex-start;gap:0.5rem}
  .card_actions{flex-direction:column}
}

/* public.css — публичная сборка (--public) поверх index.css.
   Подключается ТОЛЬКО в build.py при public=True: подменяет синий brand-500 и
   скругления base.css на токены брутализма shulgin.is-a.dev (общий /brand/brand.css
   сайта). Приватная витрина (dist/) этот файл не видит и не грузит. */

:root{
  --show-neutral-950:#0b0b0c;
  --show-neutral-900:#121214;
  --show-neutral-800:#121214;
  --show-neutral-700:rgba(255,255,255,.10);
  --show-neutral-600:rgba(255,255,255,.10);
  --show-neutral-400:#9a968f;
  --show-neutral-200:#f3f1ec;
  --show-neutral-050:#f3f1ec;
  --show-accent-500:#ee4e4e;
  --show-accent-300:#ff6a5a;
  --surface-color-card:var(--show-neutral-900);
  --surface-color-card-hover:var(--show-neutral-900);
  --surface-color-chip:var(--show-neutral-900);
  --surface-color-chip-active:var(--show-accent-500);
  --text-color-chip-active:#ffffff;
  --sticky-top:56px;               /* .brand-bar из /brand/brand.css */
}

body{ font-family:var(--f-body); }
.showcase-header_title{
  font-family:var(--f-display);
  text-transform:uppercase;
  font-size:clamp(1.9rem, 3.4vw, 2.6rem);
  line-height:1;
}

.showcase-header_search,
.reset-button,
.filter-more_toggle,
.chip{
  font-family:var(--f-mono);
  text-transform:uppercase;
  font-size:0.7rem;
  border:1px solid var(--line);
}
.filter-bar_types .chip{ padding:0.25rem 0.6rem; line-height:1.5; }

/* брутализм: прямые углы везде, где index.css задаёт border-radius */
.showcase-header_search,
.reset-button,
.filter-more_toggle,
.filter-more_panel,
.chip,
.card,
.card_preview,
.card-action,
.card_chip,
.card_play,
.card_live,
.card_new,
.prompt-dialog,
.prompt-dialog_body code{
  border-radius:0;
}

.card_chip{ font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.04em; font-size:.68rem; }
.card-action{ font-family:var(--f-mono); text-transform:uppercase; font-size:.75rem; letter-spacing:.04em; }
/* на карточке один коралловый элемент — полоса заказа; «Открыть» и «Исходник» контурные */
.card-action.is-primary{ background:transparent; color:var(--show-neutral-050); border-color:var(--line); }
.card-action:hover{ border-color:var(--show-neutral-400); }
.card_want{ font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.04em; font-size:.72rem; color:var(--show-accent-300); }
.card_want:hover,.card_want:focus-visible{ background:var(--show-accent-300); color:var(--show-neutral-950); }

.numeral-strip{ font-family:var(--f-mono); text-transform:uppercase; font-size:.7rem; letter-spacing:.06em; }
.numeral-strip_num{ font-family:var(--f-display); font-weight:900; font-size:clamp(1.5rem, 2.6vw, 2rem); letter-spacing:0; }
.card_play,.card_live,.card_new{ font-family:var(--f-mono); text-transform:uppercase; }
.card_live::before{ border-radius:0; }

.showcase-lead_link{ color:var(--show-accent-300); }

/* фон бренда (brand.css: html::before свечение+точки, body::before линии, body::after зерно):
   у галереи 13 карточек в своих цветах и живые iframe — оставляем только точки и линии,
   коралловое свечение и зерно снимаем (тихая рама, меньше композитинга на слабых телефонах) */
html::before{ background:radial-gradient(var(--dot) 1.3px, transparent 1.3px) 0 0 / 24px 24px; }
body::after{ display:none; }

</style>

<script defer>
(function () {
  "use strict";

  var catalog = JSON.parse(document.getElementById("catalog").textContent);

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var numerals = document.getElementById("numerals");
  var searchInput = document.getElementById("search");
  var resetButton = document.getElementById("reset");
  var filtersRoot = document.getElementById("filters");
  var typeRow = filtersRoot.querySelector(".filter-bar_types");
  var moreToggle = document.getElementById("moreToggle");
  var morePanel = document.getElementById("morePanel");
  var moreCount = document.getElementById("moreCount");

  var dialog = document.getElementById("promptDialog");
  var promptTitle = document.getElementById("promptTitle");
  var promptBody = document.getElementById("promptBody");
  var dialogClose = document.getElementById("dialogClose");
  var copyButton = document.getElementById("copyPrompt");
  var currentPromptText = "";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // hover-автозапуск только у мыши/тачпада и без reduced-motion; тач и reduced — только тап/клик
  var hoverPlay = !reduceMotion && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var NEW_DAYS = 14;
  var MAX_LIVE = 2;
  // заказ под приём: utm_campaign = slug. Счётчик магазина пишет в лог только utm_source/medium/campaign,
  // поэтому slug едет в utm_campaign (лишний параметр вроде t= он бы выбросил)
  var WANT_URL = "https://shulgin.is-a.dev/store/prosto/?utm_source=lab&utm_medium=card&utm_campaign=";

  // group -> Set(значения, выбранные пользователем)
  var selected = { type: new Set(), stack: new Set(), interaction: new Set() };

  function uniqueValues(field) {
    var seen = new Set();
    catalog.forEach(function (item) {
      var v = item[field];
      if (Array.isArray(v)) { v.forEach(function (x) { seen.add(x); }); }
      else if (v) { seen.add(v); }
    });
    return Array.from(seen).sort(function (a, b) { return a.localeCompare(b, "ru"); });
  }

  function buildChips() {
    ["type", "stack", "interaction"].forEach(function (group) {
      var host = filtersRoot.querySelector('[data-chip-list="' + group + '"]');
      uniqueValues(group).forEach(function (value) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = value;
        chip.dataset.group = group;
        chip.dataset.value = value;
        chip.setAttribute("aria-pressed", "false");
        chip.addEventListener("click", function () {
          if (selected[group].has(value)) { selected[group].delete(value); }
          else { selected[group].add(value); }
          var on = chip.classList.toggle("is-active");
          chip.setAttribute("aria-pressed", on ? "true" : "false");
          render();
        });
        host.appendChild(chip);
      });
    });
  }

  function matchesSearch(item, query) {
    if (!query) return true;
    var haystack = [item.title, item.summary].concat(item.tags || []).join(" ").toLowerCase();
    return haystack.indexOf(query) !== -1;
  }

  function matchesGroup(item, group) {
    var set = selected[group];
    if (set.size === 0) return true;
    var value = item[group];
    if (Array.isArray(value)) { return value.some(function (v) { return set.has(v); }); }
    return set.has(value);
  }

  function filteredItems() {
    var query = searchInput.value.trim().toLowerCase();
    return catalog.filter(function (item) {
      return matchesSearch(item, query)
        && matchesGroup(item, "type")
        && matchesGroup(item, "stack")
        && matchesGroup(item, "interaction");
    });
  }

  function buildCard(item, index) {
    var card = document.createElement("article");
    card.className = "card";

    card.item = item;

    var preview = document.createElement("div");
    preview.className = "card_preview";
    preview.style.background = item.preview_bg || "#000000";
    if (item.poster) {
      var poster = document.createElement("img");
      poster.className = "card_poster";
      poster.src = item.poster;
      poster.alt = "";
      poster.width = 840;
      poster.height = 500;
      poster.loading = index < 3 ? "eager" : "lazy";   // первый ряд виден сразу
      poster.decoding = "async";
      preview.appendChild(poster);
    }
    var play = document.createElement("button");
    play.type = "button";
    play.className = "card_play";
    play.textContent = "Оживить";
    play.setAttribute("aria-label", "Оживить: " + item.title);
    preview.appendChild(play);
    var liveMark = document.createElement("span");
    liveMark.className = "card_live";
    liveMark.setAttribute("aria-hidden", "true");
    liveMark.textContent = "LIVE";
    preview.appendChild(liveMark);
    card.appendChild(preview);

    preview.addEventListener("click", function () { card.autoStopped = false; playCard(card); });
    play.addEventListener("focus", function () { playCard(card); });
    card.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      card.autoStopped = true;   // Esc гасит и авто-карточку, сама она больше не оживёт до перерисовки
      retireCard(card);
      refillAuto();
    });
    card.addEventListener("pointerenter", function (e) {
      clearTimeout(card.retireTimer);
      if (!hoverPlay || e.pointerType !== "mouse") return;
      card.hoverTimer = setTimeout(function () { playCard(card); }, 250);
    });
    card.addEventListener("pointerleave", function () {
      clearTimeout(card.hoverTimer);
      // авто-карточки первого ряда от ухода курсора не гаснут
      if (card.classList.contains("is-live") && !card.classList.contains("is-auto")) {
        card.retireTimer = setTimeout(function () { retireCard(card); refillAuto(); }, 1500);
      }
    });

    var body = document.createElement("div");
    body.className = "card_body";

    var title = document.createElement("h3");
    title.className = "card_title heading-style-h5";
    title.textContent = item.title;
    // метка в строке заголовка, а не отдельной строкой над ним: первый ряд на 1440×900 влезает целиком
    if (isNew(item.added)) {
      var fresh = document.createElement("span");
      fresh.className = "card_new";
      fresh.textContent = "Новое";
      title.appendChild(document.createTextNode(" "));
      title.appendChild(fresh);
    }
    body.appendChild(title);

    var summary = document.createElement("p");
    summary.className = "card_summary text-size-small text-style-muted";
    summary.textContent = item.summary;
    body.appendChild(summary);

    var chips = document.createElement("div");
    chips.className = "card_chips";
    [item.type].concat(item.stack || [], [item.interaction]).forEach(function (value) {
      if (!value) return;
      var chip = document.createElement("span");
      chip.className = "card_chip";
      chip.textContent = value;
      chips.appendChild(chip);
    });
    body.appendChild(chips);

    if (item.source && item.source.project) {
      var source = document.createElement("p");
      source.className = "card_source text-size-tiny text-style-muted";
      source.textContent = "источник: " + item.source.project;
      body.appendChild(source);
    }

    var actions = document.createElement("div");
    actions.className = "card_actions";

    var open = document.createElement("a");
    open.className = "card-action is-primary";
    open.href = item.url;
    open.target = "_blank";
    open.rel = "noopener";
    open.textContent = "Открыть";
    open.dataset.cta = "lab-open-" + item.slug;
    actions.appendChild(open);

    // Публичная сборка: ссылка на исходник вместо кнопки "Промпт" (её нет — см. ниже).
    if (window.SHOWCASE_PUBLIC) {
      var source = document.createElement("a");
      source.className = "card-action";
      source.href = "https://github.com/Sanexxxx777/Sanexxxx777.github.io/blob/main/public/lab/techniques/" + item.slug + "/index.html";
      source.target = "_blank";
      source.rel = "noopener";
      source.textContent = "Исходник";
      source.dataset.cta = "lab-src-" + item.slug;
      actions.appendChild(source);
    }

    // Публичная сборка идёт без промптов — кнопки тогда нет, диалог не нужен.
    if (item.prompt_html) {
      var promptBtn = document.createElement("button");
      promptBtn.type = "button";
      promptBtn.className = "card-action";
      promptBtn.textContent = "Промпт";
      promptBtn.addEventListener("click", function () { openPrompt(item.slug); });
      actions.appendChild(promptBtn);
    }

    body.appendChild(actions);
    card.appendChild(body);

    if (window.SHOWCASE_PUBLIC) {
      var want = document.createElement("a");
      want.className = "card_want";
      want.href = WANT_URL + encodeURIComponent(item.slug);
      want.dataset.cta = "lab-want-" + item.slug;
      want.textContent = "Хочу такое на свой сайт";
      var arrow = document.createElement("span");
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";
      want.appendChild(arrow);
      card.appendChild(want);
    }
    return card;
  }

  function isNew(added) {
    var t = Date.parse(added || "");
    return !isNaN(t) && Date.now() - t <= NEW_DAYS * 864e5;
  }

  // ── живые превью: iframe только по требованию, не больше MAX_LIVE одновременно ──
  var live = [];   // карточки в порядке оживления, старшая первой
  // «далеко ушла»: карточка вышла за вьюпорт, расширенный на 40% сверху и снизу
  var farAway = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (!en.isIntersecting) retireCard(en.target); });
    // отложенно: при резком скролле autoSeen ещё не успел снять autoVisible, иначе уходящая карточка оживёт снова
    setTimeout(refillAuto, 0);
  }, { rootMargin: "40% 0px 40% 0px" }) : null;

  // ── первый ряд живёт сам: первые MAX_LIVE карточек сетки оживают, когда видны на ≥50 % ──
  // reduced-motion и «экономия трафика» = только постеры. Живых по-прежнему ≤ MAX_LIVE: наведение на
  // другую карточку гасит старшую живую, а когда та погаснет, авто-карточка оживает снова.
  // refillAuto зовётся только из наблюдателей и таймеров, НЕ из retireCard (иначе playCard → retire → play зациклится).
  var saveData = navigator.connection && navigator.connection.saveData;
  var autoSeen = !reduceMotion && !saveData && "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { en.target.autoVisible = en.isIntersecting; });
    refillAuto();
  }, { threshold: 0.5 }) : null;
  var autoReady = false, autoTimer = 0;

  function refillAuto() {
    if (!autoSeen || !autoReady) return;
    grid.querySelectorAll(".card.is-auto").forEach(function (card) {
      if (card.autoVisible && !card.autoStopped && live.length < MAX_LIVE) playCard(card);
    });
  }

  // после перерисовки (поиск по буквам) ждём паузу, чтобы не грузить iframe на каждое нажатие
  function armAuto(delay) {
    if (!autoSeen) return;
    autoSeen.disconnect();
    autoReady = false;
    clearTimeout(autoTimer);
    Array.prototype.slice.call(grid.children, 0, MAX_LIVE).forEach(function (card) {
      card.classList.add("is-auto");
      autoSeen.observe(card);
    });
    autoTimer = setTimeout(function () { autoReady = true; refillAuto(); }, delay);
  }

  function playCard(card) {
    clearTimeout(card.retireTimer);
    if (!card.isConnected || card.classList.contains("is-live")) return;
    while (live.length >= MAX_LIVE) retireCard(live[0]);
    var frame = document.createElement("iframe");
    frame.className = "card_frame";
    frame.src = card.item.url;
    frame.title = card.item.title;
    frame.addEventListener("load", function () { frame.classList.add("is-shown"); }, { once: true });
    card.querySelector(".card_preview").appendChild(frame);
    card.frame = frame;   // свой текущий кадр: прошлый может ещё гаснуть в том же превью
    card.classList.add("is-live");
    live.push(card);
    if (farAway) farAway.observe(card);
  }

  function retireCard(card) {
    clearTimeout(card.retireTimer);
    clearTimeout(card.hoverTimer);
    var i = live.indexOf(card);
    if (i === -1) return;
    live.splice(i, 1);
    if (farAway) farAway.unobserve(card);
    card.classList.remove("is-live");
    var frame = card.frame;
    card.frame = null;
    if (!frame) return;
    frame.classList.remove("is-shown");   // кроссфейд обратно на постер
    setTimeout(function () { frame.remove(); }, reduceMotion ? 0 : 250);
  }

  // ── блик по кромке (по мотивам techniques/sheen-card): позиция курсора → --mx/--my ──
  if (hoverPlay) {
    var sheenCard = null, sheenX = 0, sheenY = 0, sheenRaf = 0;
    grid.addEventListener("pointermove", function (e) {
      sheenCard = e.target.closest(".card"); sheenX = e.clientX; sheenY = e.clientY;
      if (!sheenCard || sheenRaf) return;
      sheenRaf = requestAnimationFrame(function () {
        sheenRaf = 0;
        if (!sheenCard) return;
        var r = sheenCard.getBoundingClientRect();
        sheenCard.style.setProperty("--mx", (sheenX - r.left) + "px");
        sheenCard.style.setProperty("--my", (sheenY - r.top) + "px");
      });
    });
  }

  function render(autoDelay) {
    live.slice().forEach(retireCard);
    var items = filteredItems();
    grid.innerHTML = "";
    items.forEach(function (item, i) { grid.appendChild(buildCard(item, i)); });
    empty.hidden = items.length !== 0;
    setNumeral("items", items.length);
    var extra = selected.stack.size + selected.interaction.size;
    moreCount.textContent = extra ? "· " + extra : "";
    moreCount.hidden = !extra;
    resetButton.hidden = !(extra || selected.type.size || searchInput.value.trim());
    armAuto(typeof autoDelay === "number" ? autoDelay : 600);
  }

  // ── «Ещё фильтры»: раскрывающаяся панель (кнопка aria-expanded + hidden), Esc и клик мимо закрывают ──
  function setMore(open, returnFocus) {
    moreToggle.setAttribute("aria-expanded", open ? "true" : "false");
    morePanel.hidden = !open;
    if (!open && returnFocus) moreToggle.focus();
  }
  moreToggle.addEventListener("click", function () { setMore(morePanel.hidden, false); });
  document.addEventListener("click", function (e) {
    if (!morePanel.hidden && !morePanel.contains(e.target) && !moreToggle.contains(e.target)) setMore(false, false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !morePanel.hidden) setMore(false, morePanel.contains(document.activeElement));
  });

  // затухание справа у ряда типов, только пока он реально обрезан и не докручен до конца
  function updateTypeFade() {
    var clipped = typeRow.scrollWidth - typeRow.clientWidth - typeRow.scrollLeft > 2;
    typeRow.classList.toggle("is-clipped", clipped);
  }
  typeRow.addEventListener("scroll", updateTypeFade, { passive: true });
  if ("ResizeObserver" in window) new ResizeObserver(updateTypeFade).observe(typeRow);

  // ── числовая полоса «N приёмов · T типов · S стеков» ──
  var WORDS = {
    items: ["приём", "приёма", "приёмов"],
    types: ["тип", "типа", "типов"],
    stacks: ["стек", "стека", "стеков"]
  };

  function plural(n, forms) {
    var mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return forms[0];
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
    return forms[2];
  }

  function setNumeral(key, n) {
    numerals.querySelector('[data-count="' + key + '"]').textContent = n;
    numerals.querySelector('[data-word="' + key + '"]').textContent = plural(n, WORDS[key]);
  }

  // один раз при загрузке: 0 → N за 700 мс (ease-out), reduced-motion — сразу итог
  function countUp(totals) {
    Object.keys(totals).forEach(function (k) { setNumeral(k, reduceMotion ? totals[k] : 0); });
    if (reduceMotion) return;
    var start = performance.now();
    requestAnimationFrame(function step(now) {
      var t = Math.min(1, (now - start) / 700), e = 1 - Math.pow(1 - t, 3);
      Object.keys(totals).forEach(function (k) { setNumeral(k, Math.round(totals[k] * e)); });
      if (t < 1) requestAnimationFrame(step);
    });
  }

  function openPrompt(slug) {
    var item = catalog.find(function (i) { return i.slug === slug; });
    if (!item) return;
    promptTitle.textContent = item.title;
    promptBody.innerHTML = item.prompt_html || "";
    currentPromptText = item.prompt_quote || "";
    dialog.showModal();
  }

  dialogClose.addEventListener("click", function () { dialog.close(); });
  dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

  copyButton.addEventListener("click", function () {
    copyText(currentPromptText).then(function () {
      var original = copyButton.textContent;
      copyButton.textContent = "Скопировано";
      setTimeout(function () { copyButton.textContent = original; }, 1500);
    });
  });

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  function legacyCopy(text) {
    return new Promise(function (resolve) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) { /* сдаёмся молча: кнопка всё равно покажет статус */ }
      document.body.removeChild(ta);
      resolve();
    });
  }

  searchInput.addEventListener("input", function () { render(); });
  resetButton.addEventListener("click", function () {
    searchInput.value = "";
    selected.type.clear(); selected.stack.clear(); selected.interaction.clear();
    filtersRoot.querySelectorAll(".chip.is-active").forEach(function (chip) {
      chip.classList.remove("is-active");
      chip.setAttribute("aria-pressed", "false");
    });
    render();
    // кнопка «Сбросить» после сброса прячется — фокус клавиатуры не теряем, ставим на первый тип
    if (typeRow.firstElementChild) typeRow.firstElementChild.focus({ preventScroll: true });
  });

  buildChips();
  updateTypeFade();
  render(0);
  countUp({ items: catalog.length, types: uniqueValues("type").length, stacks: uniqueValues("stack").length });
})();

</script>
</body>
</html>
