<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Торшер со шнурком</title>
<style>
:root{
  --bg:#12100e;
  --fg:#cdbfae;
  --accent:#ffcf7d;
  --accent-rgb:255,207,125;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.stage{position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 55% at 50% 62%,rgba(var(--accent-rgb),.08),transparent 70%),
  linear-gradient(180deg,#171310 0%,var(--bg) 55%,#0a0908 100%)}

/* лампа от абажура до основания занимает 77vmin (77% высоты кадра), рамка сдвинута
   на 8vmin от верха, снизу остаётся запас под пятно света на полу */
.lamp{position:absolute;left:50%;top:8vmin;width:52.04vmin;height:90vmin;transform:translateX(-50%);
  border:0;background:transparent;padding:0;color:var(--accent);cursor:pointer;isolation:isolate;
  -webkit-tap-highlight-color:transparent}
.lamp:focus-visible{outline:.14vmin solid var(--accent);outline-offset:.6vmin;border-radius:.6vmin}

/* пул света на полу под лампой, шире самой лампы, специально приплюснут по высоте, чтобы не вылезать за кадр */
.lamp::before{content:"";position:absolute;left:50%;top:68vmin;width:122.14vmin;height:20vmin;
  border-radius:50%;background:radial-gradient(ellipse,rgba(var(--accent-rgb),.28),rgba(var(--accent-rgb),.11) 45%,transparent 72%);
  filter:blur(3.72vmin);opacity:.82;transform:translateX(-50%) perspective(138.07vmin) rotateX(67deg);
  transform-origin:50% 100%;transition:opacity .32s ease,transform .32s ease;pointer-events:none}
/* конус света под абажуром: узкий у кромки абажура (не шире её), расширяется вниз; прячется ПОД абажур по z-index */
.lamp::after{content:"";position:absolute;left:50%;top:18.6vmin;width:31vmin;height:40vmin;z-index:1;
  border-radius:50%/14% 14% 86% 86%;
  background:radial-gradient(ellipse at 50% 8%,rgba(255,244,214,.92),rgba(var(--accent-rgb),.5) 38%,transparent 78%);
  filter:blur(1.8vmin);opacity:1;transform:translateX(-50%);transition:opacity .3s ease;pointer-events:none}

.lamp-shade{position:absolute;z-index:2;left:7.43vmin;top:2vmin;width:37.17vmin;height:17vmin;
  border:.53vmin solid rgba(255,255,255,.13);border-radius:50% 50% 16% 16%/76% 76% 24% 24%;
  background:linear-gradient(180deg,#3b302d,#171312 72%)}
.lamp-shade::before{content:"";position:absolute;right:4.25vmin;bottom:-2.12vmin;width:2.66vmin;height:2.66vmin;
  border-radius:50%;background:#76645c}
.lamp-shade::after{content:"";position:absolute;left:4.78vmin;right:4.78vmin;bottom:-1.59vmin;height:3.72vmin;
  border-radius:50%;background:#ffe8b5;box-shadow:0 1vmin 3vmin rgba(var(--accent-rgb),.75);
  opacity:1;transition:opacity .3s ease,box-shadow .3s ease}

.lamp-stem{position:absolute;left:25.49vmin;top:17.4vmin;width:1.59vmin;height:59.48vmin;border-radius:2px;
  background:linear-gradient(90deg,var(--bg),var(--fg),var(--bg))}
.lamp-base{position:absolute;left:10.62vmin;top:74.75vmin;width:30.8vmin;height:4.25vmin;border-radius:50%;
  background:linear-gradient(180deg,var(--fg),#181313);box-shadow:0 3.72vmin 6.37vmin rgba(0,0,0,.5)}

.lamp-cord{position:absolute;left:38.23vmin;top:16.87vmin;width:1.06vmin;height:35.05vmin;border-radius:999px;
  background:linear-gradient(90deg,#4d413d,#aa9383);transform-origin:50% 0;transition:transform .22s ease;will-change:transform}
.lamp-cord::after{content:"";position:absolute;left:50%;bottom:-5.31vmin;width:4.78vmin;height:8.5vmin;
  border-radius:3.72vmin;background:linear-gradient(180deg,#f4ddb0,#d8b875);
  box-shadow:0 1.59vmin 4.25vmin rgba(0,0,0,.34),0 0 5.31vmin rgba(var(--accent-rgb),.35);transform:translateX(-50%)}

.lamp:hover .lamp-cord,.lamp:focus-visible .lamp-cord{transform:rotate(2deg)}
.lamp.is-pulling .lamp-cord{animation:cordPull .78s cubic-bezier(.22,.78,.22,1)}
@keyframes cordPull{
  0%{transform:translateY(0) rotate(0)}
  24%{transform:translateY(6.37vmin) rotate(1deg)}
  46%{transform:translateY(-.53vmin) rotate(-4deg)}
  64%{transform:translateY(.53vmin) rotate(3deg)}
  82%{transform:translateY(0) rotate(-1.5deg)}
  100%{transform:translateY(0) rotate(0)}
}

.lamp[aria-pressed="false"]::before{opacity:0;transform:translateX(-50%) perspective(138.07vmin) rotateX(67deg) scale(.86)}
.lamp[aria-pressed="false"]::after,.lamp[aria-pressed="false"] .lamp-shade::after{opacity:.05}
.lamp[aria-pressed="false"] .lamp-shade::after{box-shadow:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="stage">
  <button class="lamp" id="lamp" type="button" aria-pressed="true" aria-label="Выключить лампу">
    <span class="lamp-shade" aria-hidden="true"></span>
    <span class="lamp-stem" aria-hidden="true"></span>
    <span class="lamp-base" aria-hidden="true"></span>
    <span class="lamp-cord" aria-hidden="true"></span>
  </button>
</div>
<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lamp = document.getElementById("lamp");
  var cord = lamp.querySelector(".lamp-cord");
  var AUTO_INTERVAL = 6000, USER_RESET = 10000, FIRST_DELAY = 1200;
  var autoTimer = null;

  function startSwing(){
    if(!lamp.classList.contains("is-pulling")) lamp.classList.add("is-pulling");
  }
  function toggleLight(){
    var on = lamp.getAttribute("aria-pressed") !== "false";
    lamp.setAttribute("aria-pressed", on ? "false" : "true");
    lamp.setAttribute("aria-label", on ? "Включить лампу" : "Выключить лампу");
  }
  cord.addEventListener("animationend", function(){
    lamp.classList.remove("is-pulling");
  });

  // визуальный рывок стартует сразу на нажатии/клавише, переключение состояния идёт одним click
  lamp.addEventListener("pointerdown", function(){ if(!reduce) startSwing(); });
  lamp.addEventListener("keydown", function(e){
    if((e.key === "Enter" || e.key === " ") && !reduce) startSwing();
  });
  lamp.addEventListener("click", function(){
    toggleLight();
    if(!reduce){ startSwing(); scheduleAuto(USER_RESET); }
  });

  function autoPull(){
    startSwing();
    toggleLight();
    scheduleAuto(AUTO_INTERVAL);
  }
  function scheduleAuto(delay){
    clearTimeout(autoTimer);
    autoTimer = setTimeout(autoPull, delay);
  }
  if(!reduce) scheduleAuto(FIRST_DELAY);

  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ clearTimeout(autoTimer); }
    else if(!reduce){ scheduleAuto(AUTO_INTERVAL); }
  });
})();
</script>
</body>
</html>
