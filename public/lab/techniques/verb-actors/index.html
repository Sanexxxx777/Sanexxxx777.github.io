<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глаголы-актёры</title>
<style>
  :root{
    /* по одному полю и одной краске на глагол: смена цвета читается как монтажная склейка */
    --f1:#14213d; --i1:#14213d; --disc:#f1e9d2; --rim:#f2b84b;   /* ВИДИТ: ночное поле, кремовая радужка, янтарный край */
    --f2:#cfeaf2; --i2:#0f5b78;                   /* ТАЕТ: ледяное поле */
    --f3:#2a1c3d; --i3:#c9f56b;                   /* ПУГАЕТСЯ: тёмно-фиолетовое поле */
    --f4:#d7261e; --i4:#190808; --ring:#fff1e0;   /* ЗЛИТСЯ: красное поле, кольца ударов */
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--f1)}
  #stage{position:fixed;inset:0;overflow:hidden;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none;
    font:900 100px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-stretch:125%}
  .f{position:absolute;inset:0;visibility:hidden}
  .v0{background:var(--f1);color:var(--i1)} .v1{background:var(--f2);color:var(--i2)}
  .v2{background:var(--f3);color:var(--i3)} .v3{background:var(--f4);color:var(--i4)}
  .w{position:absolute;left:50%;top:50%;width:max-content;white-space:nowrap;letter-spacing:.01em;
    -webkit-text-stroke:.04em currentColor;transform:translate(-50%,-50%)}
  .w span{display:inline-block;will-change:transform,opacity}
  .disc{position:absolute;border-radius:50%;background:var(--disc);display:none}
  .rim{position:absolute;border-radius:50%;box-sizing:border-box;border:max(2px,.022em) solid var(--rim);display:none;pointer-events:none}
  .dp,.pd{position:absolute;background:currentColor;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
  .dp{border-radius:50% 50% 50% 50% / 38% 38% 62% 62%} .pd{border-radius:50%}
  .r{position:absolute;border:.045em solid var(--ring);border-radius:50%;box-sizing:border-box;opacity:0;
    transform:translate(-50%,-50%);pointer-events:none}
  .v0 .h{color:#8d93a8}
  .h{position:absolute;left:0;right:0;bottom:clamp(6px,3vmin,22px);text-align:center;opacity:.55;
    font:600 clamp(9px,2.2vmin,14px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em;-webkit-text-stroke:0}
</style>
</head>
<body>
<div id="stage" tabindex="0" role="img" aria-label="Четыре глагола, буквы которых играют смысл слова: ВИДИТ, ТАЕТ, ПУГАЕТСЯ, ЗЛИТСЯ. Клик или Enter: следующий глагол"></div>
<script>
(function(){
  "use strict";
  var WORDS = ["ВИДИТ", "ТАЕТ", "ПУГАЕТСЯ", "ЗЛИТСЯ"], N = 4, SLOT = 2.6, CYCLE = SLOT * N;
  var ANCH = [.5, .4, .5, .5], CAP = [.42, .34, .42, .42], POSE = [1.0, 1.5, .85, 2.0];
  var stage = document.getElementById("stage");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 1, H = 1;

  /* ---------- математика: свои easing-функции, ничего не импортируется ---------- */
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function pOut(k, p){ return 1 - Math.pow(1 - clamp(k, 0, 1), p); }
  function pIn(k, p){ return Math.pow(clamp(k, 0, 1), p); }
  function pInOut(k, p){ k = clamp(k, 0, 1); return k < .5 ? .5 * Math.pow(2 * k, p) : 1 - .5 * Math.pow(2 * (1 - k), p); }
  function backOut(k, s){ k = clamp(k, 0, 1) - 1; return 1 + (s + 1) * k * k * k + s * k * k; }
  /* затухающая пружина в замкнутом виде: from -> to с перелётом, 2% осядет к tRel = dur */
  function spring(tRel, dur, from, to, zeta){
    if (tRel <= 0) return from;
    var wn = 4 / (zeta * dur), wd = wn * Math.sqrt(1 - zeta * zeta), e = Math.exp(-zeta * wn * tRel);
    return to + (from - to) * e * (Math.cos(wd * tRel) + (zeta * wn / wd) * Math.sin(wd * tRel));
  }
  function ring(tRel, dur, zeta){   /* удар колокола: 1 -> 0 с колебанием */
    if (tRel < 0) return 0;
    var wn = 4 / (zeta * dur), wd = wn * Math.sqrt(1 - zeta * zeta);
    return Math.exp(-zeta * wn * tRel) * Math.cos(wd * tRel);
  }
  function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------- разметка: на каждый глагол своё поле, слово из span-букв ---------- */
  var V = WORDS.map(function(txt, i){
    var f = document.createElement("div"), w = document.createElement("div"), sp = [], disc = null, rings = [], g = mulberry32(305 + 101 * i);
    f.className = "f v" + i; w.className = "w";
    if (i === 0){ disc = document.createElement("div"); disc.className = "disc"; f.appendChild(disc); }
    function mk(cls){ var e = document.createElement("div"); e.className = cls; w.appendChild(e); return e; }
    Array.from(txt).forEach(function(ch){
      var s = document.createElement("span"); s.textContent = ch; w.appendChild(s); sp.push(s);
      if (i === 3){ var r = document.createElement("div"); r.className = "r"; w.appendChild(r); rings.push(r); }
    });
    var drops = [], pd = null, rim = null, d = [];
    if (i === 1){   /* 3 капли на букву + лужа, параметры капель засеваются после a,b,c */
      sp.forEach(function(){ for (var q = 0; q < 3; q++) drops.push(mk("dp")); }); pd = mk("pd");
    }
    f.appendChild(w);
    if (i === 0){ rim = document.createElement("div"); rim.className = "rim"; f.appendChild(rim); }
    f.insertAdjacentHTML("beforeend", '<div class="h" aria-hidden="true">клик: следующий глагол</div>');
    stage.appendChild(f);
    /* засев заново для каждого глагола: три случайных числа на букву, один раз при сборке */
    var a = [], b = [], c = [];
    sp.forEach(function(){ a.push(g()); b.push(g()); c.push(g()); });
    if (i === 1) d = [];
    if (i === 1) sp.forEach(function(){ d.push([0, 1, 2].map(function(){ return [g(), g(), g(), g()]; })); });
    return { d: d, drops: drops, pd: pd, rim: rim, f: f, w: w, sp: sp, n: sp.length, a: a, b: b, c: c, disc: disc, rings: rings, fs: 1, tw: 1, cx: [] };
  });

  /* кегль подбирается так, чтобы слово занимало ~80% ширины; центры букв меряются один раз */
  function layout(){
    W = stage.clientWidth || 1; H = stage.clientHeight || 1;
    V.forEach(function(v, i){
      v.w.style.fontSize = "100px";
      var fs = Math.min(100 * .8 * W / v.w.offsetWidth, CAP[i] * H);
      v.w.style.fontSize = fs + "px"; v.w.style.top = ANCH[i] * 100 + "%";
      v.fs = fs; v.tw = v.w.offsetWidth;
      v.cx = v.sp.map(function(s){ return s.offsetLeft + s.offsetWidth / 2 - v.tw / 2; });
      v.rings.forEach(function(r, j){ r.style.left = (v.cx[j] + v.tw / 2) + "px"; r.style.top = (fs / 2) + "px"; });
      if (i === 1) v.sp.forEach(function(s){ s.style.transformOrigin = "50% 22%"; });
    });
  }

  function put(s, x, y, r, sx, sy, a){
    s.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" + r.toFixed(2) + "deg) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
    s.style.opacity = a.toFixed(3);
  }
  function shake(v, x, y){ v.w.style.transform = "translate(-50%,-50%) translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)"; }

  /* ---------- актёры: каждый = чистая функция от u, секунд внутри слота 0..2.6 ---------- */
  function actSees(v, u){   /* ВИДИТ: узкая радужка пересекает слово, буква видна, пока она внутри края */
    var fs = v.fs, tw = v.tw, R = .4 * tw;
    var ix = (-.45 + .9 * pInOut((u - .1) / 2.35, 1.6)) * tw + .02 * tw * Math.sin(u * 4.2), iy = .07 * fs * Math.sin(u * 3.1);
    var r = u < 2 ? R * backOut((u - .1) / .5, 1.4) : R * (1 - pIn((u - 2) / .5, 2)), F = .4 * fs;
    for (var j = 0; j < v.n; j++){
      var k = clamp((r - Math.hypot(v.cx[j] - ix, iy)) / F + .5, 0, 1);
      put(v.sp[j], 0, (1 - k) * .18 * fs, 0, .75 + .25 * k, .75 + .25 * k, k);
    }
    var d = v.disc.style, m = v.rim.style;
    if (r < .5){ d.display = m.display = "none"; return; }
    d.display = m.display = "block";
    d.width = d.height = m.width = m.height = 2 * r + "px"; d.left = m.left = (W / 2 + ix - r) + "px"; d.top = m.top = (ANCH[0] * H + iy - r) + "px";
  }
  function actMelts(v, u){  /* ТАЕТ: буквы по очереди оседают, тянутся вниз (квадратично), с них капает в лужу */
    var fs = v.fs, tw = v.tw, n = v.n, P = 1.12 * fs, pm = 0, ex = 0, j, q;
    for (j = 0; j < n; j++){
      var ain = pOut((u - .12 - j * .07) / .22, 2), m = .35 + j * .2 + v.a[j] * .1;
      var k = clamp((u - m) / 1.15, 0, 1), k2 = k * k, eo = clamp((u - 2.1 - j * .06) / .28, 0, 1);
      var sy = 1 + (.6 + .3 * v.c[j]) * k2, sag = .16 * fs * k2, fall = pIn(eo, 2) * .35 * fs;
      put(v.sp[j], 0, (1 - ain) * -.2 * fs + sag + fall, (v.b[j] - .5) * 5 * k2, 1 + .15 * k2, sy, ain * (1 - .2 * k2) * (1 - eo));
      pm += k2 / n; ex += eo / n;
      var yb = -.28 * fs + .64 * fs * sy + sag + fall;
      for (q = 0; q < 3; q++){
        var dd = v.d[j][q], ph = u - (m + .25 + dd[0] * .4), per = .55 + dd[1] * .3, tt = ph >= 0 ? ph % per : -1, e = v.drops[j * 3 + q].style;
        if (tt < 0 || tt >= .5){ e.opacity = 0; continue; }
        var wd = (.09 + .06 * dd[2]) * fs * clamp(tt / .1, 0, 1), y = yb + (P - yb) * Math.pow(tt / .5, 2);
        e.width = wd + "px"; e.height = wd * (1 + 1.3 * tt / .5) + "px"; e.opacity = 1 - eo;
        e.left = (v.cx[j] + tw / 2 + (dd[3] - .5) * .5 * tw / n) + "px"; e.top = (fs / 2 + y) + "px";
      }
    }
    var p = v.pd.style;
    p.width = tw * (.1 + .85 * pm) + "px"; p.height = .15 * fs * Math.sqrt(pm) + "px"; p.left = tw / 2 + "px"; p.top = (fs / 2 + P + .03 * fs) + "px";
    p.opacity = pm > .01 ? 1 - ex : 0;
  }
  function actScared(v, u){ /* ПУГАЕТСЯ: дрожь, два удара, буквы вылетают наружу, зависают и возвращаются на пружинах */
    var fs = v.fs, imp = [.5, 1.45], amp = [1, .55], jx = 0, jy = 0, q;
    for (q = 0; q < 2; q++){
      var ang = v.a[q] * 6.2832, jj = ring(u - imp[q], .5, .3) * .05 * fs * amp[q];
      jx += Math.cos(ang) * jj; jy += Math.sin(ang) * jj;
    }
    shake(v, jx, jy);
    for (var j = 0; j < v.n; j++){
      var ox = v.cx[j] / (v.tw / 2) * .5 * fs * (.6 + .5 * v.a[j]), oy = (v.b[j] - .5) * 2 * .9 * fs;
      var or = (v.c[j] < .5 ? -1 : 1) * (22 + 12 * v.a[j]), x = 0, y = 0, rot = 0;
      for (q = 0; q < 2; q++){
        var tr = u - imp[q] - j * .012;
        if (tr < 0) continue;
        var m = tr < .1 ? pOut(tr / .1, 3) : tr < .28 ? 1 : spring(tr - .28, .9, 1, 0, .32);
        x += ox * amp[q] * m; y += oy * amp[q] * m; rot += or * amp[q] * m;
      }
      x += .014 * fs * Math.sin(u * 55 + v.a[j] * 6.28); y += .014 * fs * Math.sin(u * 49 + v.b[j] * 6.28);
      var ain = clamp((u - .08 - j * .02) / .18, 0, 1), eo = pIn((u - 2.05 - j * .025) / .35, 2);
      put(v.sp[j], x + ox * 3 * eo, y + oy * 3 * eo, rot + or * eo, .7 + .3 * backOut(ain, 1.6), .7 + .3 * backOut(ain, 1.6), ain * (1 - eo));
    }
  }
  function actAngry(v, u){  /* ЗЛИТСЯ: буква за ударом, на каждом ударе пружинный штамп, кольцо и тряска слова */
    var fs = v.fs, jx = 0, jy = 0;
    for (var j = 0; j < v.n; j++){
      var tr = u - (.3 + .26 * j), ang = v.b[j] * 6.2832, jj = ring(tr, .22, .4) * .045 * fs;
      jx += Math.cos(ang) * jj; jy += Math.sin(ang) * jj;
      var s = spring(tr, .28, 1.8, 1, .45), eo = clamp((u - 2.15 - j * .03) / .25, 0, 1), tm = u > 1.7 ? .008 * fs : 0;
      put(v.sp[j], tm * Math.sin(u * 80 + v.a[j] * 6.28), tm * Math.sin(u * 71 + v.c[j] * 6.28), (v.c[j] - .5) * 10,
        s * (1 + .4 * eo), s * (1 + .4 * eo), tr < 0 ? 0 : clamp(tr / .04, 0, 1) * (1 - eo));
      var rk = tr / .4, rs = v.rings[j].style;
      if (rk >= 0 && rk < 1){ var sz = (.5 + 1.1 * pOut(rk, 2)) * fs; rs.width = rs.height = sz + "px"; rs.opacity = ((1 - rk) * .8).toFixed(3); }
      else rs.opacity = 0;
    }
    shake(v, jx, jy);
  }
  var ACT = [actSees, actMelts, actScared, actAngry];

  /* ---------- кадр = f(t): та же функция в живом цикле и в seek ---------- */
  function render(t){
    t = ((t % CYCLE) + CYCLE) % CYCLE;
    var i = Math.min(N - 1, Math.floor(t / SLOT)), u = t - i * SLOT, prev = (i + N - 1) % N;
    V.forEach(function(v, j){
      var on = j === i;
      v.f.style.visibility = on || j === prev ? "visible" : "hidden";
      v.f.style.zIndex = on ? 2 : 1;
      v.w.style.visibility = on ? "visible" : "hidden";
      if (v.disc && !on) v.disc.style.display = v.rim.style.display = "none";
    });
    var k = pOut(u / .24, 3), n = ((1 - k) * 100).toFixed(2) + "%", c = k >= 1 ? "none" : [
      "inset(0 " + n + " 0 0)", "inset(0 0 " + n + " 0)", "inset(" + n + " 0 0 0)", "inset(0 0 0 " + n + ")"][i];
    V[i].f.style.clipPath = c;
    ACT[i](V[i], u);
  }

  /* ---------- живой цикл: автодемо, клик = следующий глагол, через 4 с покоя автодемо продолжается ---------- */
  var T = 0, last = 0, raf = 0, paused = false, user = false, idle = 0, uSlot = 0, still = 0;
  function frame(ts){
    raf = 0; if (paused || document.hidden) return;
    var dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts; T += dt;
    if (user){ idle += dt; if (idle >= 4) user = false; else if (T >= (uSlot + 1) * SLOT) T -= SLOT; }
    T %= CYCLE; render(T); raf = requestAnimationFrame(frame);
  }
  function kick(){ if (!raf && !paused && !reduce && !document.hidden){ last = 0; raf = requestAnimationFrame(frame); } }
  function next(){
    if (reduce){ still = (still + 1) % N; render(still * SLOT + POSE[still]); return; }
    user = true; idle = 0; uSlot = (Math.floor(T / SLOT) + 1) % N; T = uSlot * SLOT; render(T); kick();
  }
  stage.addEventListener("pointerdown", next);
  document.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight"){ e.preventDefault(); next(); } });
  document.addEventListener("visibilitychange", function(){ if (document.hidden){ if (raf) cancelAnimationFrame(raf); raf = 0; } else kick(); });
  function redraw(){ layout(); render(reduce ? still * SLOT + POSE[still] : T); }
  new ResizeObserver(redraw).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);

  redraw(); kick();
  function pause(){ paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  window.__verbActors = {
    cycle: CYCLE,
    seek: function(t){ pause(); user = false; T = ((t % CYCLE) + CYCLE) % CYCLE; render(T); },
    pause: pause,
    resume: function(){ paused = false; kick(); }
  };
})();
</script>
</body>
</html>
