<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глитч: RGB-расщепление текста</title>
<style>
  :root{
    --bg:#0a0a0d;
    --fg:#f4f4f6;
    --accent:#ff4d6d;   /* красный канал */
    --accent-2:#23e6ff; /* голубой канал */
  }
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }

  .glitch{
    position:relative;
    display:inline-block;
    isolation:isolate;               /* mix-blend-mode каналов не выходит за пределы буквы */
    font-weight:800;
    letter-spacing:0.02em;
    text-transform:uppercase;
    font-size:clamp(2.6rem, 18vw, 9rem);
    line-height:1;
    color:var(--fg);
    user-select:none;
    cursor:default;
  }

  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;
    inset:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .glitch::before{
    color:var(--accent);
    animation: idleA 1.6s steps(1, end) infinite;
  }
  .glitch::after{
    color:var(--accent-2);
    animation: idleB 1.9s steps(1, end) infinite;
  }

  /* Наведение/тап: непрерывный сильный глитч, пока курсор/палец над текстом */
  .glitch.is-active{
    animation: glitchNudgeBurst 0.5s steps(1, end) infinite;
  }
  .glitch.is-active::before{
    animation: burstA 0.5s steps(1, end) infinite;
  }
  .glitch.is-active::after{
    animation: burstB 0.5s steps(1, end) infinite;
  }

  .glitch.reseek, .glitch.reseek::before, .glitch.reseek::after{ animation:none !important; } /* seek: пересоздать анимации с нуля */

  /* Слабая постоянная дрожь каналов: часть эстетики приёма, не только периодический сбой */
  @keyframes idleA{
    0%   { transform:translate(0,0);   opacity:.18; clip-path:inset(10% 0 82% 0); }
    25%  { transform:translate(-1px,0);opacity:.24; clip-path:inset(40% 0 52% 0); }
    50%  { transform:translate(0,0);   opacity:.16; clip-path:inset(65% 0 25% 0); }
    75%  { transform:translate(1px,0); opacity:.22; clip-path:inset(20% 0 68% 0); }
    100% { transform:translate(0,0);   opacity:.18; clip-path:inset(10% 0 82% 0); }
  }
  @keyframes idleB{
    0%   { transform:translate(0,0);   opacity:.16; clip-path:inset(55% 0 15% 0); }
    30%  { transform:translate(1px,0); opacity:.20; clip-path:inset(15% 0 62% 0); }
    60%  { transform:translate(-1px,0);opacity:.14; clip-path:inset(70% 0 8% 0); }
    100% { transform:translate(0,0);   opacity:.16; clip-path:inset(55% 0 15% 0); }
  }

  /* Сильный всплеск: включается автодемо-таймером каждые 3-4 с на 0.4-0.6 с, и вручную при hover/tap */
  @keyframes burstA{
    0%   { transform:translate(0,0) skewX(0deg);        opacity:0;   clip-path:inset(0 0 60% 0); }
    8%   { transform:translate(-3px,-1px) skewX(-6deg);  opacity:.85; clip-path:inset(8% 0 60% 0); }
    16%  { transform:translate(2px,0) skewX(0deg);       opacity:.5;  clip-path:inset(42% 0 28% 0); }
    24%  { opacity:0; }
    50%  { transform:translate(-2px,1px) skewX(4deg);    opacity:.8;  clip-path:inset(66% 0 6% 0); }
    58%  { transform:translate(3px,-1px) skewX(0deg);    opacity:.4;  clip-path:inset(14% 0 55% 0); }
    66%  { opacity:0; }
    100% { opacity:0; }
  }
  @keyframes burstB{
    0%   { opacity:0; }
    20%  { transform:translate(3px,1px) skewX(6deg);     opacity:.7;  clip-path:inset(58% 0 10% 0); }
    28%  { transform:translate(-2px,0) skewX(0deg);      opacity:.45; clip-path:inset(20% 0 52% 0); }
    36%  { opacity:0; }
    64%  { transform:translate(-3px,-1px) skewX(-4deg);  opacity:.65; clip-path:inset(2% 0 76% 0); }
    72%  { transform:translate(2px,1px) skewX(0deg);     opacity:.35; clip-path:inset(44% 0 22% 0); }
    80%  { opacity:0; }
    100% { opacity:0; }
  }

  /* Сам заголовок на миг вздрагивает только во время всплеска, в покое неподвижен */
  @keyframes glitchNudgeBurst{
    0%, 20%, 36%, 64%, 80%, 100% { transform:translate(0,0); }
    8%  { transform:translate(1px, 0); }
    50% { transform:translate(-1px, 0); }
  }

  @media (prefers-reduced-motion: reduce){
    .glitch,
    .glitch::before,
    .glitch::after{ animation:none !important; opacity:1; clip-path:none; transform:none; }
    .glitch::before,
    .glitch::after{ opacity:0; }
  }
</style>
</head>
<body>
<h1 class="glitch" data-text="ГЛИТЧ">ГЛИТЧ</h1>
<script>
(function(){
  "use strict";
  var el = document.querySelector(".glitch");
  var hovering = false;
  var autoTimer = null;
  var offTimer = null;
  var running = true;
  var held = false;   // seek держит страницу на паузе
  // засеянный PRNG: расписание сбоев одно и то же в живую и в seek (п.9)
  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  var SEED = 20261009, rnd = mulberry32(SEED), T0 = performance.now();

  function activate(){
    if (offTimer){ clearTimeout(offTimer); offTimer = null; }
    el.classList.add("is-active");
  }
  function deactivate(force){
    if (force || !hovering) el.classList.remove("is-active");
  }

  function fireAutoBurst(duration){
    if (!running || hovering) return;
    activate();
    offTimer = setTimeout(function(){ deactivate(false); }, duration);
  }

  // delay: пауза до сбоя; duration: длина сбоя (по умолчанию случайная 0.4-0.6 с)
  function scheduleNext(delay, duration){
    autoTimer = setTimeout(function(){
      fireAutoBurst(duration || 400 + rnd() * 200);
      scheduleNext(3000 + rnd() * 1000); // дальше 3-4 с
    }, delay);
  }

  el.addEventListener("pointerenter", function(){ hovering = true; activate(); });
  el.addEventListener("pointerdown", function(){ hovering = true; activate(); });
  function release(){ hovering = false; deactivate(true); }
  el.addEventListener("pointerleave", release);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);

  document.addEventListener("visibilitychange", function(){
    running = !document.hidden;
    if (!running){
      if (autoTimer) clearTimeout(autoTimer);
      if (offTimer) clearTimeout(offTimer);
      autoTimer = offTimer = null;
    } else if (!autoTimer && !held){
      scheduleNext(200);
    }
  });

  // первый сбой детерминированный: старт на 1.5 с, длина 0.7 с, чтобы приём показал себя сразу; дальше цикл 3-4 с
  scheduleNext(1500, 700);

  // seek (п.9): расписание сбоев пересчитывается тем же PRNG (первый 1.5 с / 0.7 с, дальше 0.4-0.6 с через 3-4 с),
  // класс is-active ставится по t, а CSS-анимации ведутся через currentTime от момента последней смены класса
  // (при смене is-active анимации псевдоэлементов создаются заново). cycle = 0: расписание случайное
  function plan(t){
    var r = mulberry32(SEED), st = 1.5, d = 0.7, list = [[st, d]], cur = -1;
    st += 3 + r();
    while (st <= t + 8){ d = 0.4 + r() * 0.2; list.push([st, d]); st += 3 + r(); }
    for (var i = 0; i < list.length; i++) if (list[i][0] <= t) cur = i;
    var on = cur >= 0 && t < list[cur][0] + list[cur][1], nx = list[cur + 1];
    return { on: on, ref: on ? list[cur][0] : cur >= 0 ? list[cur][0] + list[cur][1] : 0,
             off: on ? list[cur][0] + list[cur][1] - t : 0, nxt: nx[0] - t, nxtD: nx[1] };
  }
  function anims(){ return document.getAnimations().filter(function(a){ return a.effect && a.effect.target === el; }); }
  var seekT = 0;
  function pause(){ held = true; clearTimeout(autoTimer); clearTimeout(offTimer); autoTimer = offTimer = null; }
  function seek(t){
    pause(); seekT = t; hovering = false;
    var p = plan(t);
    anims().forEach(function(a){ a.cancel(); });   // иначе оставшиеся на паузе анимации прошлого кадра перекрывают новые
    el.classList.add("reseek"); void el.offsetWidth; el.classList.remove("reseek");
    el.classList.toggle("is-active", p.on); void el.offsetWidth;
    anims().forEach(function(a){ a.pause(); a.currentTime = (t - p.ref) * 1000; });
  }
  window.__glitchText = {
    cycle: 0,
    seek: seek,
    pause: function(){ seek((performance.now() - T0) / 1000); },
    resume: function(){
      var p = plan(seekT); held = false;
      anims().forEach(function(a){ a.play(); });
      if (p.on) offTimer = setTimeout(function(){ deactivate(false); }, p.off * 1000);
      scheduleNext(p.nxt * 1000, p.nxtD * 1000);
    }
  };
})();
</script>
</body>
</html>
