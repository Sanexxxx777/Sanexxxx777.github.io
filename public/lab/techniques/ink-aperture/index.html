<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кольцо-окно, нарисованное пером</title>
<style>
  :root{
    --bg:#efe4cc;          /* фон страницы до первого кадра */
    --paper-a:#f3e9d2;     /* бумага мира A */
    --ink-a:#2a2218;       /* чернила слова A */
    --paper-b:#d9e4e0;     /* бумага мира B */
    --ink-b:#18303a;       /* чернила слова B */
    --amber:#e08a14;       /* янтарное кольцо */
    --amber-deep:#b8650a;  /* капля на кончике пера */
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Перо рисует янтарное кольцо, внутри кольца виден следующий мир, камера ныряет в него"></canvas>
<script>
(function(){
  "use strict";
  var TAU = Math.PI*2, DEG = Math.PI/180;
  var FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif', MONO = 'ui-monospace,Menlo,monospace';
  /* сценарий одного такта (секунды): рисуем кольцо, пауза, нырок, оседание в новом мире */
  var BEAT = 3.2, T_D0 = .15, T_D1 = 1.2, T_LIFT = .12, T_DIVE = 1.6, D_DIVE = 1.2;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var css = getComputedStyle(document.documentElement);
  function tok(n){ return css.getPropertyValue(n).trim(); }
  var WD = [{ word:"ИДЕЯ", cap:"мир 1 из 2", paper:tok("--paper-a"), ink:tok("--ink-a") },
            { word:"САЙТ", cap:"мир 2 из 2", paper:tok("--paper-b"), ink:tok("--ink-b") }];
  var AMBER = tok("--amber"), DEEP = tok("--amber-deep");
  /* таблица колец по тактам: центр в долях экрана, масштаб, начало дуги и наклон в градусах, зерно шума */
  var ENT = [{ fx:.64, fy:.43, rm:1, st:-128, ti:-6, seed:7 }, { fx:.35, fy:.58, rm:.94, st:-112, ti:5, seed:12 }];
  var W = 0, H = 0, U = 0, R0 = 0, S0 = .4, dpr = 1, WC = [];

  function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function lerp(a, b, k){ return a + (b - a)*k; }
  function ss(a, b, x){ var t = clamp01((x - a)/(b - a)); return t*t*(3 - 2*t); }
  function eio3(x){ return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; }

  /* ---------- кольцо пера: шум, точка, контур, штрих с нажимом ---------- */
  var O = { ratio:.94, tilt:0, ov:10*DEG, noise:.015, drift:.006, curl:.045, curlSpan:30*DEG, start:0, step:1.5*DEG, wMax:20, wMin:6, att:.16, rel:.42 };
  var NZ = {};
  function nz(seed){
    if (NZ[seed]) return NZ[seed];
    var rnd = mulberry32(seed*9973 + 17), hs = [2, 3, 5, 1.37].map(function(k){ return { k:k, a:.4 + rnd(), p:rnd()*TAU }; });
    var sum = hs.reduce(function(s, h){ return s + h.a; }, 0);
    return NZ[seed] = function(u){ var s = 0; for (var i = 0; i < 4; i++) s += hs[i].a*Math.sin(hs[i].k*u + hs[i].p); return s/sum; };
  }
  function ptAt(cx, cy, r, u, n){
    var q = Math.max(0, (u - (TAU - O.curlSpan))/(O.curlSpan + O.ov));
    var f = r*(1 + O.noise*n(u))*(1 - O.drift*(u/TAU) - O.curl*q*q), a = O.start + u;
    var x = f*Math.cos(a), y = f*O.ratio*Math.sin(a), c = Math.cos(O.tilt), s = Math.sin(O.tilt);
    return [cx + x*c - y*s, cy + x*s + y*c];
  }
  function wAt(x){ return O.wMin + (O.wMax - O.wMin)*ss(0, O.att, x)*(1 - ss(1 - O.rel, 1, x)); }
  function contour(cx, cy, r, n){
    for (var i = 0; i < 180; i++){ var p = ptAt(cx, cy, r, TAU*i/180, n); if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }
    ctx.closePath();
  }
  function strokePath(cx, cy, r, prog, n){      /* заливаемый контур штриха с круглыми концами */
    var S = TAU + O.ov, sw = clamp01(prog)*S; if (sw < 1e-4 || r < .01) return;
    var st = Math.max(3, Math.ceil(sw/O.step)), m = st + 1, P = [], Wd = [], T = [], i, k;
    for (i = 0; i < m; i++){ var u = sw*i/st; P.push(ptAt(cx, cy, r, u, n)); Wd.push(wAt(u/S)); }
    for (i = 0; i < m; i++){
      var a = P[Math.max(0, i - 1)], b = P[Math.min(m - 1, i + 1)], tx = b[0] - a[0], ty = b[1] - a[1], L = Math.hypot(tx, ty) || 1;
      T.push([tx/L, ty/L]);
    }
    for (i = 0; i < m; i++){ var h = Wd[i]/2, x = P[i][0] - T[i][1]*h, y = P[i][1] + T[i][0]*h; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
    function cap(j, dir){
      var tx = T[j][0], ty = T[j][1], nx = -ty, ny = tx, h = Wd[j]/2;
      for (k = 1; k < 8; k++){ var th = Math.PI*k/8, c = Math.cos(th), s = Math.sin(th);
        ctx.lineTo(P[j][0] + dir*(nx*c + tx*s)*h, P[j][1] + dir*(ny*c + ty*s)*h); }
    }
    cap(m - 1, 1);
    for (i = m - 1; i >= 0; i--){ var hh = Wd[i]/2; ctx.lineTo(P[i][0] + T[i][1]*hh, P[i][1] - T[i][0]*hh); }
    cap(0, -1);
    ctx.closePath();
  }

  /* ---------- геометрия кольца во времени такта u ---------- */
  function kAt(u){ return eio3(clamp01((u - T_DIVE)/D_DIVE)); }
  function geom(e, u){
    var k = kAt(u), ant = 1 - .05*Math.sin(Math.PI*clamp01((u - 1.35)/.25)), r0 = R0*e.rm;
    var rEnd = .58*Math.hypot(W, H) + .12*U;           /* к концу нырка кольцо целиком за кадром */
    return { k:k, cx:lerp(e.fx*W, W/2, k), cy:lerp(e.fy*H, H/2, k), r:r0*Math.pow(rEnd/r0, k)*ant, z:1 + 1.9*k, e:e };
  }
  function setOpt(g){
    O.start = (g.e.st + 18*g.k)*DEG; O.tilt = g.e.ti*DEG; O.wMax = .052*U*g.z; O.wMin = .017*U*g.z;
  }
  function tangentEnd(g){
    var n = nz(g.e.seed), S = TAU + O.ov, a = ptAt(g.cx, g.cy, g.r, S*(1 - .02*TAU/S), n), b = ptAt(g.cx, g.cy, g.r, S, n);
    var L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    return { p:b, tx:(b[0] - a[0])/L, ty:(b[1] - a[1])/L };
  }

  /* ---------- брызги: летят от точки отрыва пера, потом оседают точками на бумаге ---------- */
  function spatter(e, u){
    var dt = u - T_D1; if (dt < 0) return;
    var g0 = geom(e, 0); setOpt(g0);
    var te = tangentEnd(g0), fa = Math.atan2(te.ty, te.tx) - 20*DEG, rnd = mulberry32(e.seed*31 + 404), c = 3.2;
    ctx.fillStyle = AMBER;
    for (var i = 0; i < 7; i++){
      var v = c*(.12 + rnd()*.2)*U, da = (rnd() - .5)*80*DEG, r = (.006 + rnd()*.009)*U, life = .55 + rnd()*.4;
      var d = Math.min(dt, life), a = fa + da, dr = (1 - Math.exp(-c*d))/c;
      var x = te.p[0] + Math.cos(a)*v*dr, y = te.p[1] + Math.sin(a)*v*dr + .5*U*d*d;
      var vx = Math.cos(a)*v*Math.exp(-c*d), vy = Math.sin(a)*v*Math.exp(-c*d) + U*d, sp = Math.hypot(vx, vy);
      var rr = dt < life ? r*(1 - .7*dt/life) : r*.3, st = dt < life ? 1 + Math.min(1.2, sp/(1.5*U)) : 1;
      ctx.beginPath(); ctx.ellipse(x, y, rr*st, rr, Math.atan2(vy, vx), 0, TAU); ctx.fill();
    }
  }

  /* ---------- кадр такта: мир w, время u, кольцо e ---------- */
  function drawBeat(w, u, e){
    var nxt = WC[w^1];
    if (u >= BEAT){ ctx.drawImage(nxt, 0, 0, W, H); return; }
    var g = geom(e, u), k = g.k, ex = e.fx*W, ey = e.fy*H, sA = 1 + .8*k, n = nz(e.seed);
    ctx.save(); ctx.translate(ex, ey); ctx.scale(sA, sA); ctx.translate(-ex, -ey);   /* камера ныряет: старый мир разлетается от кольца */
    ctx.drawImage(WC[w], 0, 0, W, H); spatter(e, u);
    ctx.restore();
    var op = ss(T_D1 + .08, T_D1 + .4, u);
    setOpt(g);
    if (op > 0){                                          /* окно: внутри кольца виден следующий мир */
      ctx.save(); ctx.beginPath(); contour(g.cx, g.cy, (g.r - .3*O.wMax)*op, n); ctx.clip();
      ctx.fillStyle = WD[w^1].paper; ctx.fillRect(0, 0, W, H);
      var s = Math.pow(S0, 1 - k); ctx.translate(g.cx, g.cy); ctx.scale(s, s); ctx.translate(-W/2, -H/2);
      ctx.drawImage(nxt, 0, 0, W, H);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = "rgba(60,40,10,.16)"; ctx.lineWidth = .04*U; ctx.stroke();   /* тень от края окна (путь жив после clip) */
      ctx.restore();
    }
    ctx.fillStyle = AMBER;
    if (k > .02){                                         /* призраки: след при нырке */
      [[.08, .3], [.04, .6]].forEach(function(q){
        var gh = geom(e, u - q[0]);
        if (Math.hypot(g.cx - gh.cx, g.cy - gh.cy) + Math.abs(g.r - gh.r) < .02*U) return;
        setOpt(gh); ctx.globalAlpha = q[1]; ctx.beginPath(); strokePath(gh.cx, gh.cy, gh.r, 1, n); ctx.fill();
      });
      ctx.globalAlpha = 1; setOpt(g);
    }
    var x = clamp01((u - T_D0)/(T_D1 - T_D0)), pr = x*x*(3 - 2*x), S = TAU + O.ov;
    ctx.beginPath(); strokePath(g.cx, g.cy, g.r, pr, n); ctx.fill();
    if (u > T_D0 && u < T_D1 + T_LIFT){                  /* капля на кончике пера, в конце срыв по касательной */
      var hd, hr;
      if (u < T_D1){ hd = ptAt(g.cx, g.cy, g.r, pr*S, n); hr = wAt(pr)/2*1.1; }
      else { var l = (u - T_D1)/T_LIFT, te = tangentEnd(g);
        hd = [te.p[0] + (te.tx + te.ty*.35)*.1*U*l, te.p[1] + (te.ty - te.tx*.35)*.1*U*l]; hr = O.wMin/2*1.2*(1 - l); }
      ctx.fillStyle = DEEP; ctx.beginPath(); ctx.arc(hd[0], hd[1], Math.max(0, hr), 0, TAU); ctx.fill();
    }
  }

  /* ---------- миры: бумага с крапом, большое слово, подпись (кэш на размер) ---------- */
  function buildWorlds(){
    WC = WD.map(function(wd, i){
      var c = document.createElement("canvas"); c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
      var x = c.getContext("2d"); x.scale(dpr, dpr);
      x.fillStyle = wd.paper; x.fillRect(0, 0, W, H);
      var rnd = mulberry32(100 + i), cnt = Math.min(2600, W*H/700 | 0);
      x.fillStyle = wd.ink;
      for (var j = 0; j < cnt; j++){ x.globalAlpha = .03 + .06*rnd(); var sz = (.6 + rnd()*1.6)*Math.max(1, U/420); x.fillRect(rnd()*W, rnd()*H, sz*(1 + 2*rnd()), sz); }
      x.globalAlpha = 1;
      x.font = "900 100px " + FONT; var w100 = x.measureText(wd.word).width;
      wd.fs = Math.min(.74*W/w100*100, .5*H); x.font = "900 " + wd.fs + "px " + FONT;
      var m = x.measureText(wd.word); wd.w = m.width;
      x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillStyle = wd.ink;
      x.save(); x.translate(W/2, H/2); x.rotate(-2*DEG);
      x.fillText(wd.word, 0, (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent)/2); x.restore();
      x.font = Math.max(9, .03*U) + "px " + MONO; x.globalAlpha = .55;
      x.fillText(wd.cap + " · нажми в любом месте", W/2, H - .05*U); x.globalAlpha = 1;
      return c;
    });
    S0 = Math.max(.28, Math.min(.65, 1.25*R0/Math.min(WD[0].w, WD[1].w)));   /* слово в окне примерно во всю ширину кольца */
  }

  /* ---------- время: автодемо = формула от t, ручной такт = от момента клика ---------- */
  var S = { t:0, mode:0, a0:0, aw:0, m:null, last:0, clicks:0 };
  function cur(){
    if (S.mode === 0){ var x = S.t - S.a0, n = Math.floor(x/BEAT), wi = (S.aw + n) & 1; return { w:wi, u:x - n*BEAT, e:ENT[wi] }; }
    return { w:S.m.w, u:Math.min(S.t - S.m.t0, BEAT), e:S.m.e };
  }
  function render(){ var c = cur(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 1; drawBeat(c.w, reduce ? 1.55 : c.u, c.e); }
  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    U = Math.min(W, H); R0 = .3*U; buildWorlds(); render();
  }
  function onDown(ev){
    var c = cur(); if (!reduce && c.u >= T_DIVE && c.u < BEAT) return;      /* во время нырка клики не берём */
    var r = cv.getBoundingClientRect(), seed = 20 + (++S.clicks), rnd = mulberry32(seed);
    S.mode = 1; S.last = S.t;
    S.m = { t0:S.t, w:(reduce || c.u >= BEAT) ? c.w^1 : c.w,
            e:{ fx:(ev.clientX - r.left)/r.width, fy:(ev.clientY - r.top)/r.height, rm:1, st:-128 + (rnd() - .5)*30, ti:(rnd() - .5)*16, seed:seed } };
    kick(); render();
  }

  /* ---------- цикл ---------- */
  var raf = 0, paused = false, lastTs = 0;
  function frame(ts){
    raf = 0; if (paused || document.hidden) return;
    var dt = lastTs ? Math.min(.05, (ts - lastTs)/1000) : 0; lastTs = ts; S.t += dt;
    if (S.mode === 1 && S.t - S.last >= 4 && S.t - S.m.t0 >= BEAT){ S.mode = 0; S.a0 = S.t; S.aw = S.m.w^1; }   /* 4 с покоя: автодемо с места */
    render(); raf = requestAnimationFrame(frame);
  }
  function kick(){ if (!reduce && !raf && !paused && !document.hidden){ lastTs = 0; raf = requestAnimationFrame(frame); } }
  function pause(){ paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }
  cv.addEventListener("pointerdown", onDown);
  addEventListener("resize", layout);
  document.addEventListener("visibilitychange", function(){ if (document.hidden){ if (raf) cancelAnimationFrame(raf); raf = 0; } else kick(); });

  layout(); kick();
  window.__inkAperture = {
    cycle: 2*BEAT,
    seek: function(t){ pause(); S.mode = 0; S.a0 = 0; S.aw = 0; S.t = t; render(); },
    pause: pause,
    resume: function(){ paused = false; kick(); }
  };
})();
</script>
</body>
</html>
