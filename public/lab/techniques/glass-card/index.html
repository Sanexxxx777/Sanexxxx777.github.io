<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стеклянная карточка с градиентной рамкой</title>
<style>
  @property --angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }
  :root{
    --bg:#0c0a08;
    --fg:#ede6db;
    --fg-muted:#9a8e7d;
    --glass:rgba(18,15,11,0.55);
    --glass-fallback:#14110d;
    --border-base:rgba(180,140,80,0.16);
    --accent:#d4a574;
    --accent-2:#8b6914;
    --green:#5dd9a3;
  }
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    position:relative;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
  }
  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:clamp(0.6rem, 3vw, 1.25rem);
    padding:0 clamp(0.75rem, 4vw, 2rem);
  }
  /* пятна лежат внутри .stage и позиционируются от её краёв в rem,
     поэтому всегда остаются под своей карточкой и в карточке 420x260, и на весь экран */
  .blob{
    position:absolute;
    top:50%;
    width:11rem;height:11rem;
    border-radius:50%;
    transform:translateY(-50%);
    pointer-events:none;
    z-index:0;
  }
  .blob--a{
    left:-2.5rem;
    background:radial-gradient(circle, rgba(212,165,116,0.6), transparent 70%);
  }
  .blob--b{
    right:-2.5rem;
    background:radial-gradient(circle, rgba(106,200,219,0.5), transparent 70%);
  }
  .card{
    position:relative;
    z-index:1;
    flex:1 1 9rem;
    max-width:15rem;
    min-width:8.25rem;
    border-radius:1.25rem;
    padding:clamp(0.85rem, 3vw, 1.25rem);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    box-shadow:0 0.5rem 1.5rem rgba(0,0,0,0.35);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, border-color .35s ease;
  }
  .card:hover{
    transform:translateY(-0.4rem);
    box-shadow:0 1rem 2rem rgba(0,0,0,0.45);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .card{background:var(--glass-fallback)}
  }
  /* рамка-градиент: ::before размером с карточку, padding = толщина рамки,
     контент вырезан маской (content-box минус полный прямоугольник = только кольцо) */
  .card--ring::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit; /* border-radius НЕ наследуется автоматически, указывать явно */
    padding:0.1875rem;
    background:conic-gradient(from var(--angle), var(--accent), var(--accent-2) 35%, transparent 55%, var(--accent) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
    pointer-events:none;
    animation:spin-border 9s linear infinite;
    transition:filter .35s ease;
  }
  .card--ring:hover::before{
    filter:brightness(1.55) saturate(1.2);
  }
  @keyframes spin-border{
    to{ --angle:360deg; }
  }
  .card--plain{
    border:1px solid var(--border-base);
  }
  .card--plain:hover{
    border-color:rgba(212,165,116,0.4);
  }
  .label{
    display:block;
    font-size:0.625rem;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--fg-muted);
    font-weight:600;
    margin-bottom:0.5rem;
  }
  .value{
    display:block;
    font-family:ui-monospace,Menlo,monospace;
    font-size:clamp(1.05rem, 4.5vw, 1.4rem);
    font-weight:700;
    color:var(--accent);
  }
  .value--muted{ color:var(--fg); }
  .delta{
    display:block;
    font-family:ui-monospace,Menlo,monospace;
    font-size:0.7rem;
    color:var(--green);
    margin-top:0.35rem;
  }
  .sub{
    display:block;
    font-size:0.7rem;
    color:var(--fg-muted);
    margin-top:0.35rem;
  }
  .caption{
    position:relative;
    z-index:1;
    margin-top:0.85rem;
    font-size:0.65rem;
    color:var(--fg-muted);
    text-align:center;
    padding:0 1rem;
  }
  @media (prefers-reduced-motion: reduce){
    .card--ring::before{ animation:none; --angle:55deg; }
  }
  /* карточка витрины (420x260 и меньше) слишком низкая для подписи под стеком карточек ,
     на маленькой высоте подпись скрывается, обе карточки остаются полностью видны с полями */
  @media (max-height: 400px){
    .caption{ display:none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="blob blob--a" aria-hidden="true"></div>
  <div class="blob blob--b" aria-hidden="true"></div>
  <section class="card card--ring">
    <span class="label">Total Balance</span>
    <span class="value">$12,480.52</span>
    <span class="delta">+2.4% за 24ч</span>
  </section>
  <section class="card card--plain">
    <span class="label">Active Bots</span>
    <span class="value value--muted">12 / 14</span>
    <span class="sub">2 на паузе</span>
  </section>
</main>
<p class="caption">слева рамка вырезана маской и вращается · справа обычное стекло</p>
</body>
</html>
