<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Резиновый ползунок</title>
<style>
  :root{
    --bg:#11151b;
    --panel:#1d242e;
    --track:#303a48;
    --fill:#5fe0b4;
    --knob:#f3f7fa;
    --fg:#e8edf2;
    --muted:#7d8a9a;
    --cursor:#ffb454;
  }
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  .stage{position:absolute;inset:0}
  .ctl{position:absolute;display:flex;align-items:center;box-sizing:border-box;background:var(--panel);
    padding:0 var(--pad);gap:var(--gap);border-radius:999px;touch-action:none;cursor:grab;outline:none;
    --q:0;box-shadow:0 .18em 1.6em rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 calc(3px * var(--q)) rgba(95,224,180,calc(var(--q) * .55));font-size:var(--ch)}
  .ctl.held{cursor:grabbing}
  .ctl:focus-visible{outline:3px solid var(--fill);outline-offset:3px}
  .ico{flex:none;width:var(--ic);height:var(--ic);color:var(--fg)}
  .ico path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico .sp{fill:currentColor;stroke:none}
  .trk{position:relative;flex:1;height:var(--th);border-radius:999px;background:var(--track)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--fill)}
  .knob{position:absolute;left:0;top:50%;width:var(--kd);height:var(--kd);margin:calc(var(--kd) / -2) 0 0 calc(var(--kd) / -2);
    border-radius:50%;background:var(--knob);box-shadow:0 .05em .35em rgba(0,0,0,.5);will-change:transform}
  .val{flex:none;width:var(--lw);text-align:right;font-size:.34em;font-weight:650;font-variant-numeric:tabular-nums;color:var(--fg)}
  .cap{position:absolute;left:0;right:0;text-align:center;color:var(--muted);font-size:clamp(10px,2.5vmin,16px);letter-spacing:.02em}
  .dot{position:absolute;left:0;top:0;border-radius:50%;background:var(--cursor);pointer-events:none;opacity:0;will-change:transform;box-sizing:border-box;border:2px solid var(--bg)}
</style>
</head>
<body>
<div class="stage" id="st">
  <div class="ctl" id="ctl" role="slider" tabindex="0" aria-label="Громкость" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="sp" d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><path id="w1" d="M14.5 9.2a4 4 0 0 1 0 5.6"/><path id="w2" d="M17.3 6.6a8 8 0 0 1 0 10.8"/></svg>
    <div class="trk" id="trk"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="val" id="val">35</div>
  </div>
  <div class="cap" id="cap">Тяни ручку за край: ползунок растягивается как резина</div>
  <div class="dot" id="dot"></div>
</div>
<script>
(function(){
  "use strict";
  var T = 7.5, V0 = 0.35, POSTER = 1.75;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function(i){ return document.getElementById(i); };
  var E = { ctl:$("ctl"), fill:$("fill"), knob:$("knob"), val:$("val"), cap:$("cap"), dot:$("dot"), w1:$("w1"), w2:$("w2") };
  var G = {}, HOLDS = [];

  /* ---------- математика: пружина с начальной скоростью, резина ---------- */
  function released(t, tr, x, v, target, resp, damp){
    var tau = t - tr, w0 = 2*Math.PI/resp, k = damp*w0, wd = w0*Math.sqrt(1 - damp*damp);
    var A = x - target, B = (v + k*A)/wd;
    return target + Math.exp(-k*tau)*(A*Math.cos(wd*tau) + B*Math.sin(wd*tau));
  }
  function rubber(d){ return d <= 0 ? 0 : G.R*d/(d + G.R); }      /* d' = R*d/(d+R); у источника R = 90 px, у витрины 0.32 ширины пилюли */
  var clamp = function(x,a,b){ return Math.min(b, Math.max(a, x)); };
  var sm = function(u){ u = clamp(u,0,1); return u*u*(3 - 2*u); };
  var EASE = { io:function(u){ return u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2; },
    o:function(u){ return 1 - Math.pow(1 - u, 3); }, i:function(u){ return Math.pow(u, 1.7); }, n:function(u){ return u; } };
  var CG = 1.8;
  var RS = { resp:.42, damp:.55 };                                  /* отпускание: период .42 с, затухание .55 = один заметный перелёт */

  /* ---------- раскладка ---------- */
  function layout(){
    var W = innerWidth, H = innerHeight, s = E.ctl.style;
    var cw = Math.min(W*.7, 780), ch = Math.min(cw*.2, H*.24, 150), x0 = (W - cw)/2, cy = H*.46;
    var pad = ch*.32, ic = ch*.4, lw = ch*.95, gap = ch*.2, th = ch*.2, kd = ch*.56;
    var tw0 = cw - 2*pad - ic - lw - 2*gap;
    G = { W:W, H:H, cw:cw, ch:ch, x0:x0, cy:cy, kr:kd/2, L:tw0 - kd, tx0:x0 + pad + ic + gap, R:cw*.32 };
    var set = function(k,v){ s.setProperty(k, v.toFixed(2) + "px"); };
    set("--ch", ch); set("--pad", pad); set("--ic", ic); set("--lw", lw); set("--gap", gap); set("--th", th); set("--kd", kd);
    E.cap.style.top = (cy + ch*.5 + ch*.55).toFixed(1) + "px";
    var d = ch*.26; E.dot.style.width = E.dot.style.height = d.toFixed(1) + "px"; G.dr = d/2;
    buildHolds();
  }
  var hi = function(o){ return 1 + o; }, lo = function(o){ return -o; };   /* перетяг руки в долях длины трека */
  function Hx(h, t){
    var k = h.keys, j = 1;
    if (t <= k[0][0]) return k[0][1];
    while (j < k.length - 1 && t > k[j][0]) j++;
    var a = k[j-1], b = k[j], u = clamp((t - a[0])/(b[0] - a[0]), 0, 1);
    return a[1] + (b[1] - a[1])*EASE[b[2] || "n"](u) + (b[3] || 0)*Math.sin(u*Math.PI*4)*Math.sin(u*Math.PI);
  }
  /* сценарий автодемо: три захвата руки. Ключ = [время, положение руки в долях трека, easing, дрожь] */
  function buildHolds(){
    HOLDS = [
      { g:.12, r:2.3, lift:true, keys:[[.12,V0],[.6,.7,"io"],[1.35,hi(1),"io"],[2.0,hi(1),"n",.03],[2.5,hi(.4),"io"]] },
      { g:3.3, r:4.4, lift:true, keys:[[3.3,1],[3.45,1,"n"],[4.05,.1,"io"],[4.4,lo(1),"i"]] },
      { g:5.4, r:6.3, lift:false, keys:[[5.4,0],[5.5,0,"n"],[6.2,V0,"io"],[6.3,V0,"n"]] }
    ];
    HOLDS.forEach(function(h){
      h.rx = Hx(h, h.r); h.rv = (h.rx - Hx(h, h.r - 1e-3))/1e-3; h.tgt = clamp(h.rx, 0, 1);
    });
  }
  /* side: с какого края отпустили (+1 справа, -1 слева); при перелёте внутрь пилюля короче покоя на cR или cL */
  function pose(x, flat, side){
    var p = { v:clamp(x,0,1), sL:0, sR:0, cL:0, cR:0 };
    if (flat) return p;
    if (x > 1) p.sR = rubber((x - 1)*G.L); else if (x < 0) p.sL = rubber(-x*G.L);
    else if (side > 0) p.cR = Math.min(G.cw*.06, (1 - x)*G.L*CG);
    else if (side < 0) p.cL = Math.min(G.cw*.06, x*G.L*CG);
    return p;
  }
  var knobPX = function(p){ return G.tx0 - p.sL + p.cL + G.kr + p.v*G.L + p.sR; };

  /* кадр автодемо как чистая функция t */
  function demo(tIn){
    var t = ((tIn % T) + T) % T, h, i, held = false, x, tau = 0, best = null;
    for (i = 0; i < HOLDS.length; i++){
      h = HOLDS[i];
      if (t >= h.g && t < h.r){ held = true; x = Hx(h, t); best = h; break; }
      if (h.r <= t) best = h;
    }
    if (!held){
      h = best || HOLDS[HOLDS.length - 1]; tau = t - h.r + (best ? 0 : T);
      x = (h.tgt === h.rx || tau > 1.4) ? h.tgt : released(tau, 0, h.rx, h.rv, h.tgt, RS.resp, RS.damp);
    } else h = best;
    var press = held ? sm((t - h.g)/.1) : sm(1 - tau/.25);
    var side = h.rx > 1 ? 1 : h.rx < 0 ? -1 : 0, kx = knobPX(pose(x, false, side)), cx = kx, cy = G.cy + G.ch*.1, a = 1;
    if (held){}
    else if (h.lift && tau < .3){ var u = tau/.3; cx = knobPX(pose(h.rx)); cy -= G.ch*.35*EASE.o(u); a = 1 - u; }
    else if (h.lift && t < (h === HOLDS[0] ? 2.9 : 4.85)) a = 0;
    else {
      var w = t >= 2.9 && t < 3.3 ? 2.9 : t >= 4.85 && t < 5.35 ? 4.85 : 0;
      if (w){ var e = 1 - EASE.io((t - w)/(w === 2.9 ? .4 : .5)); cx += G.ch*.9*e; cy += G.ch*.7*e; a = Math.min(1, (t - w)/.15); }
    }
    return { x:x, side:held ? 0 : side, press:press, cur:{ x:cx, y:cy, a:a, down:held ? 1 : 0 } };
  }

  /* ---------- состояние ---------- */
  var S = { mode:"auto", clock:0, demoStart:0, lastInput:0, ret:null };
  var U = { held:false, x:V0, off:0, rel:null, samples:[], press:0 };
  var raf = 0, last = 0, paused = false, lastVal = -1, lastKX = 0;

  function frame(){
    if (S.mode === "auto") return demo(S.clock - S.demoStart);
    if (S.mode === "ret"){
      if (S.clock - S.ret.tr > .9){ S.mode = "auto"; S.demoStart = S.clock; return demo(0); }
      return { x:released(S.clock, S.ret.tr, S.ret.x, 0, V0, .5, .9), press:0, cur:null };
    }
    var x = U.x;
    if (U.rel){
      if (S.clock - U.rel.tr > 1.4){ U.x = x = U.rel.target; U.rel = null; }
      else x = released(S.clock, U.rel.tr, U.rel.x, U.rel.v, U.rel.target, RS.resp, RS.damp);
    }
    return { x:x, side:U.rel ? (U.rel.x > 1 ? 1 : -1) : 0, press:U.press, cur:null };
  }

  function render(f){
    var p = pose(f.x, reduce && S.mode !== "auto", f.side);
    var q = clamp((p.sL + p.sR)/(G.cw*.18), 0, 1), cs = E.ctl.style, ch = G.ch*(1 - .16*q + 6*(p.cL + p.cR)/G.cw);
    cs.left = (G.x0 - p.sL + p.cL).toFixed(2) + "px"; cs.width = (G.cw + p.sL + p.sR - p.cL - p.cR).toFixed(2) + "px";
    cs.setProperty("--q", q.toFixed(3)); cs.height = ch.toFixed(2) + "px"; cs.top = (G.cy - ch/2).toFixed(2) + "px";
    var kc = G.kr + p.v*G.L + p.sR, pr = f.press;
    E.knob.style.transform = "translate(" + kc.toFixed(2) + "px,0) scale(" + ((1 + .35*q)*(1 + .12*pr)).toFixed(3) + "," + ((1 - .2*q)*(1 + .12*pr)).toFixed(3) + ")";
    E.fill.style.width = kc.toFixed(2) + "px";
    var n = Math.round(p.v*100);
    if (n !== lastVal){
      lastVal = n; E.val.textContent = n; E.ctl.setAttribute("aria-valuenow", n);
      E.w1.style.opacity = n === 0 ? 0 : clamp(p.v*3, .3, 1); E.w2.style.opacity = clamp(p.v*3 - 1.2, 0, 1);
    }
    lastKX = knobPX(p);
    var c = f.cur, d = E.dot.style;
    if (c && c.a > .01){
      d.opacity = c.a.toFixed(3);
      d.transform = "translate(" + (c.x - G.dr).toFixed(1) + "px," + (c.y - G.dr).toFixed(1) + "px) scale(" + (1 - .28*c.down*pr).toFixed(3) + ")";
      d.boxShadow = "0 0 0 " + (G.dr*.5*pr).toFixed(1) + "px rgba(255,180,84," + (.28*pr).toFixed(3) + ")";
    } else d.opacity = 0;
    E.ctl.classList.toggle("held", U.held);
  }

  /* ---------- живой цикл ---------- */
  function tick(ts){
    raf = 0; if (paused || document.hidden) return;
    var dt = last ? Math.min(.05, (ts - last)/1000) : 0; last = ts;
    S.clock += dt;
    if (S.mode === "user"){
      U.press += ((U.held ? 1 : 0) - U.press)*(1 - Math.exp(-dt*18));
      if (!U.held && !U.rel && !reduce && S.clock - S.lastInput > 4){ S.mode = "ret"; S.ret = { tr:S.clock, x:clamp(U.x, 0, 1) }; }
    }
    render(frame());
    if (!reduce || U.rel || (S.mode === "user" && Math.abs(U.press - (U.held ? 1 : 0)) > .01)) raf = requestAnimationFrame(tick); else last = 0;
  }
  function kick(){ if (!raf && !paused && !document.hidden){ last = 0; raf = requestAnimationFrame(tick); } }
  function pause(){ paused = true; if (raf) cancelAnimationFrame(raf); raf = 0; }

  /* ---------- пользователь ---------- */
  function takeover(x){
    if (S.mode !== "user"){ U.x = x; U.rel = null; U.press = 0; }
    S.mode = "user"; S.lastInput = S.clock; S.ret = null;
  }
  var rawAt = function(px){ return (px - G.tx0 - G.kr)/G.L; };
  E.ctl.addEventListener("pointerdown", function(e){
    takeover(frame().x); U.rel = null; U.held = true; U.samples = [];
    U.off = Math.abs(e.clientX - lastKX) <= G.kr*1.3 ? e.clientX - lastKX : 0;   /* схватил ручку: без скачка, схватил трек: ручка прыгает под палец */
    U.x = rawAt(e.clientX - U.off); U.samples.push({ t:e.timeStamp/1000, x:U.x });
    try { E.ctl.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault(); E.ctl.focus({ preventScroll:true }); paused = false; kick(); render(frame());
  });
  E.ctl.addEventListener("pointermove", function(e){
    if (!U.held) return;
    U.x = rawAt(e.clientX - U.off); S.lastInput = S.clock;
    U.samples.push({ t:e.timeStamp/1000, x:U.x }); if (U.samples.length > 8) U.samples.shift();
    kick(); if (reduce) render(frame());
  });
  function release(e){
    if (!U.held) return;
    U.held = false; S.lastInput = S.clock;
    var s = U.samples, v = 0, n = s.length, a, i;
    if (n > 1 && e.timeStamp/1000 - s[n-1].t < .08){
      a = s[n-1]; for (i = n - 2; i >= 0; i--){ if (s[n-1].t - s[i].t <= .1) a = s[i]; }
      if (s[n-1].t > a.t) v = clamp((s[n-1].x - a.x)/(s[n-1].t - a.t), -8, 8);   /* скорость руки в долях трека за секунду */
    }
    if (reduce || (U.x >= 0 && U.x <= 1)) U.x = clamp(U.x, 0, 1);
    else U.rel = { tr:S.clock, x:U.x, v:v, target:clamp(U.x, 0, 1) };
    kick(); render(frame());
  }
  E.ctl.addEventListener("pointerup", release);
  E.ctl.addEventListener("pointercancel", release);
  E.ctl.addEventListener("keydown", function(e){
    var cur = clamp(frame().x, 0, 1), d = 0, to = null;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") d = .05; else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = -.05;
    else if (e.key === "PageUp") d = .1; else if (e.key === "PageDown") d = -.1;
    else if (e.key === "Home") to = 0; else if (e.key === "End") to = 1; else return;
    e.preventDefault(); takeover(cur); U.held = false; U.rel = null;
    U.x = clamp(to !== null ? to : Math.round((cur + d)*100)/100, 0, 1);
    paused = false; kick(); render(frame());
  });
  addEventListener("resize", function(){ layout(); render(frame()); });
  document.addEventListener("visibilitychange", function(){ if (document.hidden){ if (raf) cancelAnimationFrame(raf); raf = 0; } else kick(); });

  layout();
  if (reduce) S.clock = POSTER;                                    /* статичный кадр: рука тянет за край; дальше драг работает с мгновенным упором */
  render(frame()); kick();

  /* seek(t): кадр автодемо на время t, дальше пауза; resume() продолжает сценарий с этого места */
  window.__rubberSlider = {
    cycle: T,
    seek: function(t){ pause(); S.mode = "auto"; S.demoStart = 0; S.clock = t; U.held = false; render(demo(t)); },
    pause: pause,
    resume: function(){ paused = false; kick(); }
  };
})();
</script>
</body>
</html>
