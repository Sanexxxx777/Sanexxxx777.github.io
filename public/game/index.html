<link rel="icon" href="/favicon.svg">
<script>
(function(){try{
  var E='https://backend-test.45-82-95-142.nip.io:8443/hit';
  var l=(localStorage.getItem('lang')||navigator.language||'').slice(0,5);
  var r='';try{r=document.referrer?new URL(document.referrer).host:''}catch(e){}
  var q=location.search.replace(/^\?/,'');
  var base='p='+encodeURIComponent(location.pathname)+'&l='+encodeURIComponent(l)+'&r='+encodeURIComponent(r)+'&q='+encodeURIComponent(q);
  navigator.sendBeacon(E+'?'+base);
  var md=0;addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-innerHeight;var d=h>0?Math.round(scrollY/h*100):100;if(d>md)md=d;},{passive:true});
  addEventListener('pagehide',function(){navigator.sendBeacon(E+'?e=depth&d='+md+'&'+base);});
  document.addEventListener('click',function(ev){var el=ev.target&&ev.target.closest?ev.target.closest('[data-cta]'):null;if(el){navigator.sendBeacon(E+'?e=cta&d='+encodeURIComponent(el.getAttribute('data-cta'))+'&'+base);}});
}catch(e){}})();
</script>
<script>
(function(){
  var lang=new URLSearchParams(location.search).get('lang');
  if(!lang){try{lang=localStorage.getItem('lang')}catch(e){}}
  var to='https://stonewake.site-check-worker.workers.dev/?v6=1'+(lang==='en'||lang==='ru'?'&lang='+lang:'');
  var l=(lang==='en'||lang==='ru')?lang:((navigator.language||'ru').slice(0,2)==='ru'?'ru':'en');
  document.documentElement.setAttribute('data-l',l);
  document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('a.go').forEach(function(a){a.href=to})});
  setTimeout(function(){location.replace(to)},150);
})();
</script>
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;color:#f3f1ec;font:16px/1.4 system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  a{color:#ee4e4e}
  small{color:#9a968f;display:block;margin-top:8px}
  .t{margin:0 0 20px;color:#9a968f}
  .go{display:inline-block;font:600 18px/1.2 system-ui,-apple-system,sans-serif;color:#0b0b0c;background:#ee4e4e;padding:14px 22px;text-decoration:none;margin:4px 0}
  .go:hover{background:#d94343}
  .back{display:block;margin-top:22px;color:#9a968f}
  html[data-l="ru"] [lang="en"],html[data-l="en"] [lang="ru"]{display:none}
  main [lang="en"]{margin-top:18px}
  html[data-l] main [lang="en"]{margin-top:0}
</style>
</head>

<main>

      <a class="back" href="/ru/" data-cta="game-back">← назад в портфолио</a>
    </div>
    <div lang="en">
      <p class="t">Opening the game…</p>
      <a class="go" href="https://stonewake.site-check-worker.workers.dev/?v6=1" data-cta="game-open">Open Stonewake →</a>
      <a class="back" href="/" data-cta="game-back">← back to the portfolio</a>
    </div>
    <small>shulgin.is-a.dev/game</small>
  </div>
</main>
</body>
