    <!-- One-time hop for Russian-language browsers landing on "/" with no stored choice (the language
         switch stores one). Never for bots: navigator.webdriver is true under automation. -->
    <script>
      (function () {
        try {
          if (location.pathname !== "/" || navigator.webdriver) return;
          if (localStorage.getItem("lang")) return;
          if ((navigator.language || "").toLowerCase().indexOf("ru") === 0)
            location.replace("/ru/" + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
